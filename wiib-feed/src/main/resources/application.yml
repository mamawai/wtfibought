server:
  port: 8081

spring:
  # 本地密钥：根目录跑命中第 1 条，IDEA(工作目录=模块)命中第 2 条；线上无此文件，占位符由 env_file 注入
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  application:
    name: wiib-feed
  threads:
    virtual:
      enabled: true
  # K线落库(KlineStreamCache → common.KlineHistoryStore)；连接参数全来自 .env
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:wiib}?reWriteBatchedInserts=true
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    hikari:
      pool-name: wiib-feed-hikari
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: wiib-feed

# WS 接入 + REST 回填
binance:
  ws-url: wss://stream.binance.com:9443/ws
  futures-ws-url: wss://fstream.binance.com/ws
  rest-base-url: https://api.binance.com
  futures-rest-base-url: https://fapi.binance.com
  symbols:
    - BTCUSDT
    - ETHUSDT
    - DOGEUSDT
    - SOLUSDT
    - XRPUSDT
    - BNBUSDT
    - ZECUSDT
  # bStock(代币化美股，纯现货无合约)：价并入 Spot 流，5m K线走现货端点单独一条连接
  stock-symbols:
    - MUBUSDT
    - SPCXBUSDT
    - SNDKBUSDT
    - CRCLBUSDT
    - QQQBUSDT
    - MSTRBUSDT
    - NVDABUSDT
    - AMDBUSDT
    - TSLABUSDT
    - SOXLBUSDT
  # 大宗商品(TradFi 永续，无现货)：黄金/原油，只进合约流
  commodity-symbols:
    - XAUUSDT
    - CLUSDT
  # 美股/ETF 永续(纯合约无现货)：与商品同链路，只进合约流
  tradfi-symbols:
    - SNDKUSDT
    - SOXLUSDT
    - SKHYNIXUSDT
    - MUUSDT
    - KORUUSDT
    - SPCXUSDT
  # 纯合约加密币(Binance 主站只有永续没现货)：与商品同链路，只进合约流
  crypto-futures-symbols:
    - HYPEUSDT

# /internal/streams(流健康+重试)由共享 InternalApiFilter 校验此 token；须与 sim/quant 同值
# (三进程读同一 .env；无默认值，不填起不来)
internal:
  api:
    token: ${INTERNAL_API_TOKEN}

---
# 哨兵模式(线上高可用，配合 redis-compose.yml)：.env 里 SPRING_PROFILES_ACTIVE=sentinel 启用，
# 经哨兵发现主库、故障自动切换。生效后上面的 REDIS_HOST/PORT 被忽略，REDIS_PASSWORD/DB 照常
spring:
  config:
    activate:
      on-profile: sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
