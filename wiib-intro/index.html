<head>

<link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="intro.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="flow.css">
<script>
  // 主题必须赶在首帧之前定，否则暗色用户每次冷启动都要闪一下白
  (function () {
    // 有 JS 才藏住待拆字的大标题，没 JS 时照常显示
    document.documentElement.classList.add('js');
    var t = null; try { t = localStorage.getItem('wiib-intro-theme'); } catch (e) { }
    var dark = location.search.includes('dark') || (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>

<body>

<!-- 顶栏：字标 + 章节导航（当前章节前一颗橙点）+ 右侧工具；往下滚出一根细线，字标收成 WIIB.，正中浮出图形 logo（同主站） -->
<header class="hdr" id="hdr">
  <div class="wrap top">
    <a class="logo" id="logo" href="https://wtfibought.com" aria-label="WhatIfIBought">WHATIFIBOUGHT<i>.</i></a>
    <nav class="nav" id="head-nav">
      <a href="#s-dash" data-t="navDash"></a>
      <a href="#s-wake" data-t="navWake"></a>
      <a href="#s-review" data-t="navReview"></a>
      <a href="#s-chat" data-t="navChat"></a>
      <a href="#s-alpha" data-t="navAlpha"></a>
      <a href="#s-base" data-t="navBase"></a>
    </nav>
    <div class="tools">
      <button type="button" id="btn-lang" aria-label="Language"><svg data-icon="languages"></svg></button>
      <button type="button" id="btn-theme" aria-label="Theme"><svg data-icon="sun"></svg></button>
      <a href="https://github.com/mamawai/wtfibought" aria-label="GitHub"><svg data-icon="github"></svg></a>
      <a class="btn sm ink head-cta" href="https://wtfibought.com"><span data-t="navCta"></span><svg data-icon="arrow-right"></svg></a>
    </div>
    <img class="hmark" src="logo.png" alt="" aria-hidden="true">
  </div>
</header>

<main>

<!-- ===== 首屏：照主站 PC 登录页。整块铺圆点网（左下聚出示例 trader 的净值山脊），左边标题和一行事实，右边一张示例 trader 卡
     带 data-clear 的是有字的块，烟到跟前让开 ===== -->
<section class="hero" id="hero">
  <canvas class="hero-dots" id="dots" aria-hidden="true"></canvas>
  <div class="wrap hero-in">
    <div class="hero-l">
      <div class="hero-copy" data-clear>
        <div class="hero-kicker reveal" data-t="heroKicker"></div>
        <h1 class="hero-h letters" aria-label="What if I bought"><span class="ln">What if</span><span class="ln">I bought<i>.</i></span></h1>
        <p class="hero-say reveal" data-delay="2" data-t="heroSub"></p>
        <div class="cta-row reveal" data-delay="3">
          <a class="btn lg ink" href="https://wtfibought.com"><span data-t="ctaMain"></span><svg data-icon="arrow-right"></svg></a>
          <a class="btn lg" href="https://github.com/mamawai/wtfibought"><svg data-icon="github"></svg><span data-t="ctaGh"></span></a>
        </div>
      </div>
      <div class="hero-facts reveal" data-delay="4" id="facts" data-clear></div>
    </div>
    <div class="hero-r">
      <div class="hcard reveal" data-delay="2" id="hcard" data-clear></div>
    </div>
  </div>
</section>

<!-- ===== 首屏下面：一次唤醒的六步 + 行情 ===== -->
<div class="wrap wake1">
  <div class="loop reveal" id="loop"></div>
  <div id="mount-market" class="reveal" data-delay="1"></div>
</div>

<!-- 章节头：左边淡色大编号（进视口滚到位）· 标题 · 说明 -->

<!-- ===== 01 看板 ===== -->
<section class="sec" id="s-dash">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">01</span>
      <div>
        <h2 class="reveal" data-t="s1h"></h2>
        <p class="lead reveal" data-delay="1" data-t="s1lead"></p>
      </div>
    </div>
    <div id="mount-dash" class="reveal" data-delay="2"></div>
  </div>
</section>

<!-- ===== 02 流程 ===== -->
<section class="sec" id="s-wake">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">02</span>
      <div>
        <h2 class="reveal" data-t="s2h"></h2>
        <p class="lead reveal" data-delay="1"><span data-t="s2lead"></span><span class="hint pc-only" data-t="s2hint"></span></p>
      </div>
    </div>
    <div id="mount-trader" class="reveal" data-delay="2"></div>
  </div>
</section>

<!-- ===== 03 复盘：一条圆点时间线随滚动从左到右点亮，下面三块 ===== -->
<section class="sec" id="s-review">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">03</span>
      <div>
        <h2 class="reveal" data-t="s3h"></h2>
        <p class="lead reveal" data-delay="1" data-t="s3lead"></p>
      </div>
    </div>
    <div class="trk" id="trk">
      <i class="trk-line" aria-hidden="true"><i></i></i>
      <i class="trk-head" aria-hidden="true"></i>
      <div class="tk"><b data-t="tk1t"></b><span data-t="tk1s"></span></div>
      <div class="tk"><b data-t="tk2t"></b><span data-t="tk2s"></span></div>
      <div class="tk"><b data-t="tk3t"></b><span data-t="tk3s"></span></div>
      <div class="tk"><b data-t="tk4t"></b><span data-t="tk4s"></span></div>
      <div class="tk"><b data-t="tk5t"></b><span data-t="tk5s"></span></div>
    </div>
    <div class="feats n3 rv-feats">
      <div class="blk feat reveal">
        <div class="feat-h"><span class="feat-n num">01</span><span class="tag ink sm"><svg data-icon="notebook-pen"></svg>DEBRIEF</span></div>
        <h3 data-t="r1t"></h3><p data-t="r1p"></p><div class="kv" data-t="r1k"></div>
      </div>
      <div class="blk feat reveal" data-delay="1">
        <div class="feat-h"><span class="feat-n num">02</span><span class="tag ink sm"><svg data-icon="scroll-text"></svg>REVIEW</span></div>
        <h3 data-t="r2t"></h3><p data-t="r2p"></p><div class="kv" data-t="r2k"></div>
      </div>
      <div class="blk feat reveal" data-delay="2">
        <div class="feat-h"><span class="feat-n num">03</span><span class="tag ink sm"><svg data-icon="clipboard-list"></svg>LEDGER</span></div>
        <h3 data-t="r3t"></h3><p data-t="r3p"></p><div class="kv" data-t="r3k"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 04 对话 ===== -->
<section class="sec" id="s-chat">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">04</span>
      <div>
        <h2 class="reveal" data-t="s4h"></h2>
        <p class="lead reveal" data-delay="1" data-t="s4lead"></p>
      </div>
    </div>
    <div id="mount-chat" class="reveal" data-delay="2"></div>
  </div>
</section>

<!-- ===== 05 挖因子 ===== -->
<section class="sec" id="s-alpha">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">05</span>
      <div>
        <h2 class="reveal" data-t="sAh"></h2>
        <p class="lead reveal" data-delay="1"><span data-t="sAlead"></span><span class="hint pc-only" data-t="s2hint"></span></p>
      </div>
    </div>
    <div id="mount-alpha" class="reveal" data-delay="2"></div>
  </div>
</section>

<!-- ===== 06 底层：四块 + 一句引文 ===== -->
<section class="sec" id="s-base">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">06</span>
      <div>
        <h2 class="reveal" data-t="s5h"></h2>
        <p class="lead reveal" data-delay="1" data-t="s5lead"></p>
      </div>
    </div>
    <div class="feats n4">
      <div class="blk feat reveal">
        <div class="feat-h"><span class="feat-ic"><svg data-icon="candlestick-chart"></svg></span><span class="feat-lbl">MARKET</span></div>
        <h3 data-t="b1t"></h3><p data-t="b1p"></p><div class="feat-rows" data-t="b1k"></div>
      </div>
      <div class="blk feat reveal" data-delay="1">
        <div class="feat-h"><span class="feat-ic"><svg data-icon="scale"></svg></span><span class="feat-lbl">RULES</span></div>
        <h3 data-t="b2t"></h3><p data-t="b2p"></p><div class="feat-rows" data-t="b2k"></div>
      </div>
      <div class="blk feat reveal" data-delay="2">
        <div class="feat-h"><span class="feat-ic"><svg data-icon="layers"></svg></span><span class="feat-lbl">LEDGER</span></div>
        <h3 data-t="b3t"></h3><p data-t="b3p"></p><div class="feat-rows" data-t="b3k"></div>
      </div>
      <div class="blk feat reveal" data-delay="3">
        <div class="feat-h"><span class="feat-ic"><svg data-icon="server"></svg></span><span class="feat-lbl">TOPOLOGY</span></div>
        <h3 data-t="b4t"></h3><p data-t="b4p"></p><div class="feat-rows" data-t="b4k"></div>
      </div>
    </div>
    <!-- 引文：关键半句被一道主色淡底扫过 -->
    <blockquote class="pull reveal"><p data-t="pullQ"></p></blockquote>
  </div>
</section>

<!-- ===== 07 不止 AI：每格是 App 里对应功能的入口（同主站首页「入口」） ===== -->
<section class="sec" id="s-more">
  <div class="wrap">
    <div class="sec-head">
      <span class="sec-no num" aria-hidden="true">07</span>
      <div><h2 class="reveal" data-t="s6h"></h2></div>
    </div>
    <div class="ent reveal">
      <a href="https://wtfibought.com/coin"><span class="ent-ic"><svg data-icon="candlestick-chart"></svg></span><span><b data-t="m1t"></b><span data-t="m1p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
      <a href="https://wtfibought.com/backtest"><span class="ent-ic"><svg data-icon="flask-conical"></svg></span><span><b data-t="m2t"></b><span data-t="m2p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
      <a href="https://wtfibought.com/strategies"><span class="ent-ic"><svg data-icon="line-chart"></svg></span><span><b data-t="m3t"></b><span data-t="m3p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
      <a href="https://wtfibought.com/ai"><span class="ent-ic"><svg data-icon="message-square"></svg></span><span><b data-t="m4t"></b><span data-t="m4p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
      <a href="https://wtfibought.com/ranking"><span class="ent-ic"><svg data-icon="trending-up"></svg></span><span><b data-t="m5t"></b><span data-t="m5p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
      <a href="https://wtfibought.com"><span class="ent-ic"><svg data-icon="smartphone"></svg></span><span><b data-t="m6t"></b><span data-t="m6p"></span></span><svg class="ent-go" data-icon="arrow-up-right"></svg></a>
    </div>
  </div>
</section>

<!-- ===== 收尾 ===== -->
<section class="sec close">
  <div class="wrap">
    <h2 class="reveal" data-t="closeH"></h2>
    <div class="close-row reveal" data-delay="1">
      <p class="lead" data-t="closeLead"></p>
      <div class="cta-row">
        <a class="btn lg ink" href="https://wtfibought.com"><span data-t="ctaMain"></span><svg data-icon="arrow-right"></svg></a>
        <a class="btn lg" href="https://github.com/mamawai/wtfibought"><svg data-icon="github"></svg><span data-t="ctaGh"></span></a>
      </div>
    </div>
  </div>
</section>

</main>
