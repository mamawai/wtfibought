# 网关：占住 wiib-sim / wiib-agent / wiib-feed 三个主机名，按 active/<服务>.conf 把流量转给在任的槽位。
# 切换是改那一行再 nginx -s reload：新连接走新槽位，已经建立的连接（SSE、WebSocket）留在旧 worker 上直到自己断开
events {
    worker_connections 4096;
}

http {
    # docker 内置 DNS；上游用变量写，每次请求现解析
    resolver 127.0.0.11 valid=2s ipv6=off;
    # 不记访问日志（宿主 nginx 那层记）
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 不设 X-Real-IP：宿主 nginx 填好的真实 IP 原样往下传
    proxy_buffering off;
    # agent 响应里的 X-Accel-Buffering: no 原样传给宿主 nginx
    proxy_pass_header X-Accel-Buffering;
    # 盖过 30 分钟的实时页 SSE
    proxy_read_timeout 2100s;
    proxy_send_timeout 2100s;
    # 和宿主 nginx 一致
    client_max_body_size 10m;

    server {
        listen 8080;
        include /etc/nginx/wiib/active/sim.conf;
        location / {
            proxy_pass http://$sim_upstream;
        }
    }

    server {
        listen 8081;
        include /etc/nginx/wiib/active/feed.conf;
        location / {
            proxy_pass http://$feed_upstream;
        }
    }

    server {
        listen 8082;
        include /etc/nginx/wiib/active/agent.conf;
        location / {
            proxy_pass http://$agent_upstream;
        }
    }
}
