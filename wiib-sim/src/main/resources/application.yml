server:
  port: 8080

spring:
  # 本地密钥：根目录跑命中第 1 条，IDEA(工作目录=模块)命中第 2 条；线上无此文件，占位符由 env_file 注入
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  application:
    name: wiib-sim
  threads:
    virtual:
      enabled: true
  # 连接参数全来自 .env
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:wiib}?reWriteBatchedInserts=true
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    hikari:
      pool-name: wiib-hikari
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 300000
      # 别调短：连接一换 PG 就新建 backend 会重读 pg_catalog
      # 内网直连没设备掐空闲连接，取 Hikari 默认 30min
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: wiib-sim

# 不配则关闭 LinuxDo 登录；本地/线上两对凭证分别放 .env.local / 线上 .env
linuxdo:
  client-id: ${LINUXDO_CLIENT_ID:}
  client-secret: ${LINUXDO_CLIENT_SECRET:}
  redirect-uri: ${LINUXDO_REDIRECT_URI:http://localhost:3000/login}

# 与 LinuxDo 并存；开了任一正式登录方式则管理员直登关闭。
# admin-password 启动时同步到管理员账号(id=1)——开密码登录必须配：
# 邀请码只有管理员能生成，id=1 没密码就没人能生成码、也就没人能注册
auth:
  password-login:
    enabled: ${PASSWORD_LOGIN_ENABLED:false}
    admin-password: ${ADMIN_PASSWORD:}

trading:
  initial-balance: 10000
  # 假名盐。改了全站假名整体重排(纯展示，不动数据)，但同一次部署内必须稳定——
  # 用随机值等于每重启一次全站假名换一遍，"稳定假名"就没了
  alias-salt: ${TRADE_ALIAS_SALT:wiib-public-trade}

# sim 只用 REST（补漏/行情兜底），WS 直连在 feed 进程
binance:
  rest-base-url: https://api.binance.com
  futures-rest-base-url: https://fapi.binance.com
  symbols:
    - BTCUSDT
    - ETHUSDT
    - DOGEUSDT
    - SOLUSDT
    - XRPUSDT
    - BNBUSDT
    - ZECUSDT
  # 五分类盈亏归集用：TradFi 永续，黄金/原油
  commodity-symbols:
    - XAUUSDT
    - CLUSDT
  # 美股/ETF 永续(纯合约无现货)：盈亏归 bstock 桶
  tradfi-symbols:
    - SNDKUSDT
    - SOXLUSDT
    - SKHYNIXUSDT
    - MUUSDT
    - KORUUSDT
    - SPCXUSDT
  # 纯合约加密币(Binance 主站只有永续没现货)：不进现货补漏，盈亏归 crypto 桶
  crypto-futures-symbols:
    - HYPEUSDT

websocket:
  max-connections: 10000
  heartbeat-interval: 15         # 秒

# quant 调 sim 的 /internal/** 须带 X-Internal-Token；须与 feed/quant 同值
# (三进程读同一 .env；无默认值，不填起不来)
internal:
  api:
    token: ${INTERNAL_API_TOKEN}

# FeedInternalClient：拉 WS 流健康快照 + 转发手动重试
feed:
  internal:
    base-url: ${FEED_INTERNAL_BASE_URL:http://localhost:8081}

# LDC 瓜分活动的分发接口。不配凭证或 enabled=false 则整个发放功能关闭，
# 活动页照常显示积分，只是领取按钮不可用——本地开发与他人 clone 不会因缺配置起不来
ldc:
  base-url: ${LDC_BASE_URL:https://credit.linux.do}
  client-id: ${LDC_CLIENT_ID:}
  client-secret: ${LDC_CLIENT_SECRET:}
  enabled: ${LDC_ENABLED:false}
  claim-days: ${LDC_CLAIM_DAYS:3650}   # 十年=不设期限；奖是人家挣的，晚来也该给

---
# 哨兵模式(线上高可用，配合 redis-compose.yml)：.env 里 SPRING_PROFILES_ACTIVE=sentinel 启用，
# 经哨兵发现主库、故障自动切换。生效后上面的 REDIS_HOST/PORT 被忽略，REDIS_PASSWORD/DB 照常
spring:
  config:
    activate:
      on-profile: sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
