# Tool description catalog (English). @Tool descriptions are compile-time constants and cannot be
# swapped, so LocalizedToolCallbacks substitutes the tool.<name> entry from here instead; a tool with
# no entry keeps the description from its annotation (so tools can be moved over one at a time).
# A description only says what can be looked up — never "look up more / look up less". That is an
# open decision the system prompt hands to the model.
tool:
  # News tool: the language is baked into the instance at graph-build time; this entry is the
  # description only — which language the bodies come in is not the model's choice.
  news_search: |-
    Get the recent important news flashes (title + full body + source + time). A flash is already
    the complete text — there is no such thing as deep-reading a single one.

  # Web search as a local tool (only on Gemini endpoints backed by Antigravity): each call sends a
  # separate search-only request, see WebSearchTool
  web_search: |-
    Search the web for the query. Returns an answer written from the search results (answer) and the
    sources it drew on (sources: title and url). Returns available=false when the search found nothing.

  # Deep analysis: one call = 3 deep-model calls; the description nails down "expensive" and "needs the user's nod".
  # Word for word the same as the zh entry apart from the trigger phrases: the description is read by the
  # model, the trigger phrases have to match what the user actually types, so only those follow the language.
  run_deep_analysis: |-
    Run a full deep market analysis (Bull vs Bear adversarial debate + Judge verdict) for a symbol.
    ONLY call when the user EXPLICITLY asks with words like "deep dive"/"full analysis"; for ordinary
    trend/outlook questions answer from your tools directly - never call this uninvited.
    EXPENSIVE: costs 3 deep-model LLM calls. Requires user approval per session.
    If the result status is PENDING_APPROVAL, tell the user approval is needed and why - the UI
    will show a confirmation card; after they approve, call this tool again to execute.
    Once approved it runs in the background: status RUNNING means it has started. Answer what you
    can now and tell the user the verdict follows; do not call it again or wait for it - you will
    be woken with the report (narrative, bull/range/bear scenario distribution, invalidation
    condition, noDirection flag) when it is done.

  # Dispatch a background worker agent: the preset fixes tools and model, the main agent writes the brief; returns at once, the report wakes the main agent
  delegate: |-
    Hand a self-contained sub-task to a background worker agent and return at once.
    worker: "researcher" (reads the news flashes and, when the endpoint allows, the web; returns a sourced
    digest) or "analyst" (pulls live market data and indicators for symbols; returns a structured brief).
    brief: the whole task in one message - objective, scope (symbols / time range / sources), what the
    report must contain and roughly how long it may be. The worker sees nothing of this conversation.
    Returns {runId, status: "running"} immediately: keep answering what you can, do not wait or poll;
    you will be woken with the worker's report. Several may run at once up to the user's limit;
    a refusal comes back as {error} - then do that part yourself with your own tools.

  # ---- Market/indicator data tools (shared by the chat main agent and trader wake-ups) ----
  # English entries are the annotation text verbatim; the annotation stays as the last-resort fallback.
  market_snapshot: |-
    Get a real-time cross-section of a crypto perpetual symbol (short-timeframe view, not candles).
    Fields and sign conventions:
    - lastPrice; atr is the 5m atr14 — for stop distances use the atr14 of your own timeframe from `indicators`
    - price_change: {5m,15m,30m,1h,4h,24h} percent change per window
    - regime: a rule-based label on 15m indicators — TREND_UP/TREND_DOWN (adx>25, direction by DI),
      SQUEEZE (adx<15 and Bollinger bandwidth<1.5), SHOCK (recent 5m ATR > 2x its longer average),
      RANGE (everything else); a rule, not a judgement
    - fundingDeviation: (current rate - 0.01%) / 0.03%; positive = longs paying up (crowded long), negative = crowded short
    - oiChangeRate: open-interest change over the last 4h as a raw ratio (0.03 = +3%); positive = money entering, negative = leaving
    - lsrExtreme: percentile of the retail long/short account ratio within the last 24h mapped to [-1,1];
      near +1 = long accounts crowded to an extreme, -1 = short extreme
    - topTraderBias: change in the top traders' position long/short ratio, second half of the last 2h vs the first; positive = adding longs
    - takerPressure: change in the taker buy/sell ratio over the last 2h, positive = buying strengthening;
      tradeDelta: taker-buy share of recent trades mapped to [-1,1], positive = buyers dominate;
      largeTradeBias: direction of large trades, positive = mostly buys
    - liquidationPressure: share of long liquidations among recent liquidations mapped to [-1,1];
      positive = longs being liquidated (selling force), negative = shorts; liquidationVolumeUsdt is the total
    - bidAskImbalance / spotBidAskImbalance: top-5 levels (bid qty - ask qty) / total for futures / spot; positive = thicker bids
    - spotPerpBasisBps: perp premium over spot in basis points; positive = perp trading rich
    - fearGreed: "value(label)", 0 = extreme fear, 100 = extreme greed
    - qualityFlags: each NO_* means that input is missing and its score is 0 — that 0 is "no data", not "neutral"
    Apart from price_change / oiChangeRate / spotPerpBasisBps / atr, scores live in [-1,1]; larger magnitude = more extreme.

  option_iv: |-
    Get option implied-volatility context for a crypto symbol from Deribit.
    Coverage: BTC/ETH have the DVOL index plus ATM IV; SOL/XRP have ATM IV only
    (USDC-settled options, no DVOL); other symbols have no option data.
    - dvolIndex: Deribit's 30-day implied volatility index (annualized %), present only for BTC/ETH
    - ivSummary: ATM_IV = mark IV of the call nearest the money in the nearest expiry
      more than a day away, annualized %;
      25d_skew = avg IV of calls 5-8% OTM minus avg IV of puts 5-8% OTM
      (positive = calls richer; 0 = not enough strikes to compute);
      term_slope = ATM IV of the next expiry minus the nearest (positive = further expiry priced higher)
    Useful for judging whether the options market is pricing in larger moves than realized volatility suggests.

  funding_history: |-
    Get recent funding rate history (last 30 settlements; the interval is per contract, 8h for
    most, 4h or 1h for some) plus the next funding time and current mark price for a crypto
    perpetual symbol. Rates are raw decimals per settlement: 0.0001 = 0.01%. Useful for carry judgment:
    persistently positive funding = longs paying shorts (crowded long), negative = the opposite.

  orderbook_depth: |-
    Get the top 10 bid/ask levels (price, quantity) of the futures orderbook for a crypto
    perpetual symbol. Useful for seeing where large resting orders (walls) sit relative to
    current price when choosing limit order placement or judging near support/resistance.

  klines: |-
    Get raw OHLCV candlesticks for a crypto perpetual symbol from Binance futures.
    Returns a fixed 192 rows [openTime(ms), open, high, low, close, volume], oldest first;
    the last row is the current still-forming candle (its close is the live price,
    its volume is only partial) and the bar that just closed is the row before it. Tell
    whether the last row is still forming by its openTime: openTime plus one interval later
    than now means it is still running. This is the only tool that includes that forming row;
    `indicators` and `kline_structure` work on closed bars only.
    interval: 5m/15m/1h/4h/1d — 192 bars span 16h / 2d / 8d / 32d / 192d respectively.
    Call it when your method requires reading the candles bar by bar: verifying candle
    patterns, applying your own swing or structure definition, or inspecting a stretch
    that `kline_structure` pointed you at. This is the only tool that gives you every
    bar — `kline_structure` carries raw candles too, but only the recent ones and those
    around each key point.
    If you also call `kline_structure` on the same symbol+interval, pass
    includeBars=false there so its focus_bars don't repeat these rows.

  indicators: |-
    Get the full classic technical indicator set for a crypto perpetual symbol, computed
    on the requested interval (5m/15m/1h/4h/1d) over the closed candles of the same 192-bar
    window `klines` returns. The still-forming candle is left out, so "last bar" below always
    means the bar that just closed. Fields:
    ma7/ma25/ma99 + ema12/ema20/ema26 (moving averages); ma_alignment: 1 = MA7>MA25>MA99 bullish
    stacking, -1 = bearish stacking, 0 = tangled;
    rsi14 + rsi14_trend (>70 overbought, <30 oversold);
    macd_dif/dea/hist + macd_hist_trend (momentum); macd_cross appears only when a golden/death
    cross happened on the last bar, otherwise the field is absent;
    boll_upper/mid/lower + boll_pb (%B on a 0-100 scale: >100 closed above the upper band, <0 below
    the lower band, 50 at the middle) + boll_bandwidth ((upper-lower)/mid*100; shrinking = squeeze,
    expanding = trending);
    atr14 (Wilder RMA volatility; common stop-distance unit);
    kdj_k/d/j; adx + plus_di/minus_di (adx>25 trending, <15 ranging; direction = which DI is larger);
    obv/obv_ma20/obv_trend + volume_ma20/volume_ratio (volume confirmation; volume_ratio = last bar
    volume / 20-bar average);
    close_trend. Every *_trend field is one of rising_5 (5 consecutive rises), falling_5, mostly_up,
    mostly_down, sideways.

  kline_structure: |-
    Structural summary of the closed candles in the same 192-bar window that `klines`
    returns — path, segments, volume-by-price and key levels, computed for you. The
    still-forming last row of `klines` is left out. Neutral facts only: no trend or
    reversal calls, that judgement is yours.
    Read these before using the numbers:
    - atr14 is Wilder RMA — the exact same value the `indicators` tool reports. avg_tr_* is a
      plain arithmetic mean of True Range: shorter memory, tracks current volatility, and is
      NOT ATR. Never mix the two.
    - swings are local extremes over ±swingWindow bars. The last swingWindow bars can never
      qualify (their right side isn't confirmed yet), so a turn that just happened is missing.
    - segments_swing cuts at swing points and adjacent segments SHARE their boundary bar, so
      their volumes add up to more than volume.total. Do not sum them.
    - every idx refers to the same row order as `klines` on this symbol+interval; the forming
      row is simply absent here. If a bar closed between the two calls the window has slid by
      one row — match rows by time_ms / openTime then, not by idx.
    What you get is the computed path plus focus_bars — the last N candles and the ones
    around each key point; `klines` is the tool that hands you every raw bar instead.

  # ---- The trader read-only profile tools (held by the chat main agent; userId baked in at leaf build) ----
  trader_overview: |-
    Get the current user's AI trader profile: status (RUNNING/PAUSED/LIQUIDATED and why),
    equity vs initial balance, round number, traded symbols, wake interval, risk spec,
    last / next wake-up time and why it cannot be woken right now (null when it can),
    and the FULL review memory notes (what it has learned so far).
    Returns hasTrader=false when the user has not created a trader yet.

  trader_positions: |-
    Get the current open positions of the user's AI trader: symbol, side, quantity,
    entry price, leverage, unrealized PnL and the currently active stop-loss/take-profit orders.
    Returns hasTrader=false when the user has not created a trader yet.

  trader_decisions: |-
    Get the recent decision timeline of the user's AI trader, newest first. Each entry has
    kind (TRADE=scheduled wake / ALERT=volatility wake / MANUAL=owner's manual wake / REVIEW=daily retrospective),
    status, equity, the tools it called, and its FULL reasoning text. Can be narrowed to one kind.
    Use this to answer "why did it do that trade" - the reasoning text is the answer.

  trader_plans: |-
    Get the trading plans of the user's AI trader: all live plans plus the recently closed ones.
    Each plan carries the thesis (playType), the data it cited (signalsUsed), the invalidation
    condition, entry/stop/target prices and the revision history of stop-loss moves.

  trader_trades: |-
    Get the closed trades of the user's AI trader, newest first: symbol, side, leverage, entry and
    close price, realized PnL, open/close time, how it was closed (closeManner: stopLoss / takeProfit /
    manual / liquidated), the plan behind it (playType, signalsUsed, invalidation condition, original
    stop and target) and, for a manual close, the close reason it wrote. Also count, wins and total
    realized PnL over the returned trades. Returns hasTrader=false when the user has not created a trader yet.

  # ---- The three form tools that act on the trader (held by the chat main agent; they only open a form) ----
  wake_trader: |-
    Open the "wake trader now" form for the user. IMPORTANT: this does NOT wake the trader.
    It only shows a card with when it last woke, when it wakes next, and a button the user presses themselves.
    Waking is EXPENSIVE AND REAL (burns their model budget, MAY OPEN OR CLOSE POSITIONS) - that is exactly
    why the trigger belongs to the user, not to you.
    Never say the trader has been woken; say the form is open and waiting for them to confirm.

  review_trader_now: |-
    Open the "run retrospective now" form for the user. IMPORTANT: this does NOT run the retrospective.
    It only shows a card with the last retrospective time, whether there is new material, and a button
    the user presses themselves. Running it costs one deep-model call.
    Never say the retrospective has run or claim to know what it says; say the form is open.

  leave_note_to_trader: |-
    Open the "leave a note" form, pre-filled with the note you drafted from the user's own words.
    IMPORTANT: this does NOT save the note - the user reviews your draft, sets how many wake-ups it
    should last, and presses save themselves.
    A note is a passing remark carried by the next N wake-ups then erased; standing rules belong in the
    trader's trading instructions on its config page, not here.
    Never say the note has been saved; say the form is open with your draft in it.

  # ---- Wake-up trading tools (the trader's action tools; guards are enforced server-side, the description is the manual) ----
  get_account: |-
    Get your full account state: available balance, open positions (with id, side, quantity,
    entry price, leverage, unrealized PnL, liquidation price, current stop-loss/take-profit)
    and pending limit orders. This same state is already injected into your opening message
    every round (the [Account] block), so you normally do not need to call this; use it only
    to confirm the account after your own trades within this round.

  open_position: |-
    Open a futures position on your sim account (cross margin). Hard rules (violations are rejected
    with a reason you can fix, and the rejection tells you the exact allowed range): leverage must land
    INSIDE the range your owner configured — it is a range, not a ceiling, so picking too low is
    rejected too; when opening a NEW position the margin (=quantity*price/leverage) must land
    inside the configured percent-of-equity band (adds are exempt); same-symbol leverage must
    match any position or pending order already on that symbol;
    LIMIT price within 5% of mark and resting on the far side of it (LONG below, SHORT above) — a LIMIT
    that would fill at once is rejected, use MARKET for that; stopLossPrice and takeProfitPrice are both REQUIRED and on the correct side.
    playType is your thesis label: BREAKOUT/PULLBACK/REVERSAL/TREND_FOLLOW/RANGE/NEWS/FUNDING/OTHER.
    signalsUsed: one sentence citing the concrete data fields your thesis rests on.
    invalidationCondition: the market condition that would prove your thesis wrong (NOT a PnL
    number); it becomes part of your position's plan.
    Stop, take-profit (= the plan's target) and invalidation condition are all filed into the plan and
    injected back into your next opening message.

  close_position: |-
    Close (part of) an open position by positionId (from the [Account] block in your opening message, or get_account), at market price.
    quantity: coins to close; pass the full position quantity to close it entirely.
    reason: one sentence on why you are closing now.

  set_stop_loss: |-
    Replace the stop-loss of an open position (positionId from the [Account] block in your opening message, or get_account). The new stop
    always covers the WHOLE position — you do not pass a quantity. Guard: tighten only —
    LONG stops may only move UP, SHORT stops only DOWN (relative to the current stop); it cannot
    sit on the far side of the current price (it would fire at once). To exit, use close_position.
    reason is REQUIRED and becomes part of the position's public plan revision history.

  set_take_profit: |-
    Replace the take-profit of an open position (positionId from the [Account] block in your opening message, or get_account). The new target
    always covers the WHOLE position — you do not pass a quantity. Guard: away only —
    LONG targets may only move UP, SHORT targets only DOWN; it cannot sit on the far side of the
    current price (it would fire at once). To leave early, use close_position.
    reason is REQUIRED (public plan revision history).

  write_plan: |-
    Backfill a trading plan for an open position that has NO plan record (positionId from the
    [Account] block in your opening message, or get_account). The stop is copied from the position's
    current stop-loss order; targetPrice falls back to its current take-profit order when omitted.
    Rejected if the position already has a plan — plans are immutable; the only
    legal ways to change a thesis are adding to the position or closing and reopening.

  cancel_order: Cancel a pending limit order by orderId (from the [Account] block's pendingOrders in your opening message, or get_account).

  # Behaviour analysis: one call = 7 internal data endpoints + one large deep-model call. Same shape
  # as run_deep_analysis; only the trigger phrases follow the language.
  # The full report goes to the UI as a card over SSE and the model gets a trimmed copy, which is why
  # the description tells it to talk about the report rather than read the numbers out.
  analyze_my_behavior: |-
    Run a full behaviour analysis of THIS user's own account across every dimension of the
    platform (crypto spot, tokenized US equities, futures, prediction) plus
    a risk profile and targeted suggestions.
    ONLY call when the user EXPLICITLY asks about their own habits/style/risk profile, e.g.
    "analyse my behaviour"/"what kind of trader am I"/"my risk profile" - never call this uninvited.
    EXPENSIVE: 7 internal data calls plus one large deep-model call. Results are cached for
    30 minutes, so calling it twice in a row gains nothing.
    The full report is rendered as a card in the chat UI. Your job afterwards is to talk about
    it, not to recite every number - unless cardShown is false, in which case the user cannot
    see the card and you must state the key findings yourself.

  # Instruction generator: the thesis record is paired and computed by code; tags with few trades show counts only
  trader_play_stats: |-
    Get the owner's trader closed-trade record in the current round grouped by thesis tag (playType):
    trade count, wins/losses and PnL per tag, paired and computed by code.

  # Instruction generator: showing a card ends the turn; the answer comes back as the next user message
  ask_user: |-
    Show the user one question card and end this turn; their answer arrives as the next message.
    A card has the question, your recommended option with the reason, and 2-4 other options;
    the user can also skip the options and type their own answer.

  # Instruction generator: the writer streams the body, then it comes back to the agent
  write_draft: |-
    Have the writer produce the next version of the instruction from the Q&A so far. The body is streamed
    to the user; when done you get the body and notes back.
