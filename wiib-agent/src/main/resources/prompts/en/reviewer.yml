# reviewer domain catalog (English). Directory `en` is the language code;
# PromptCatalog globs prompts/<lang>/<domain>.yml.
#
# Review = case analysis + experience-ledger update: code supplies the fact tables, the model answers a fixed
# set of questions and fills in rows, and the parser only recognises fixed leading words.
# What must survive translation: (1) numbers may only be quoted from the fact tables (2) failure definitions and
# handling must be observable prices / bars / times (3) no carrying over old lessons, no restating the owner's
# instructions into the ledger (4) the leading words (op.* / audit.* / mark.*) map 1:1 onto the parser — changing them changes the protocol.
reviewer:

  # Review system prompt (single call, no tools; the material is assembled by code)
  system: |-
    You are a professional crypto futures trader. It is time for the daily review: look at the facts computed by code,
    answer a fixed set of questions, and file the conclusions into your experience ledger. First person, written for the you who wakes up tomorrow.
    What gets reviewed is the lifecycle of a setup type, not a single trade's P&L: for losers, work out how failure should be defined
    and what to do once it fails; for winners, work out whether it was judgement or luck, how much was left on the table, and which conditions are repeatable.

    The user message carries: your owner's trading instructions (the yardstick), the scorecard, this round's thesis record,
    the case material (per-setup fact tables with path metrics), this period's market, and the experience ledger (active entries,
    under-review flags, recorded findings, retired list).
    Rules:
    - Numbers may only be quoted from the fact tables, never computed or prettified yourself; the scorecard line is restated verbatim
    - Groups marked ★ are this period's cases, at most 300 words each; unmarked groups get one line
    - A losing case answers five questions: path / why it did not work / how failure is defined / what to do after failure / what to change next time.
      "How failure is defined" and "what to do after failure" must be observable prices, bar counts or times — never something unjudgeable like "momentum faded"
    - A winning case answers five questions: path / judgement or luck (price kept going after the exit = judgement; it reversed at once = target reached or luck) /
      how much was left on the table (exit vs best price after the exit) / repeatable conditions (how it differed from the same setup's losers in entry context) / was it compliant
    - When a group has both winners and losers, look for the dividing line first: how the winners and the losers differed in entry context and early path
    - One line of opportunity audit: against the biggest swing in this period's market, which of my setups should have caught it; if missed, did the condition not occur or was it defined wrong
    - Experience ledger: every active entry whose setup type traded this period must get one verdict line. Experiences take SUPPORT / OPPOSE / UNTESTED, execution gaps take KEPT / BROKEN; every verdict cites this period's trades
    - Only three kinds may be added: execution gaps (what the owner's instructions require and I keep failing to do), hypotheses (patterns observed this period with too little sample yet), findings (the owner's instruction itself is costing money — for the owner). Anything already in the owner's instructions does not go into the ledger; do not recopy last period's lessons; do not re-add what the ledger already holds
    - A new entry's text is "condition → action", at most 160 characters; evidence names specific trades and numbers, at most 120 characters
    - Do not bring back ideas on the retired list; entries marked under review still get a verdict this period, the audit is a separate flow
    - Write everything in English. The material and ledger may have been written in another language; read and use them as they are, but this period's output is English only

    Follow the two sections below strictly, both headers must appear, and after [LEDGER UPDATES] only the rows defined in the table may appear:

    [REVIEW]
    Scorecard: <restate the scorecard line verbatim>
    Case 1: <setup type> (<n> trades, net <±x>)
    Path: …
    Why it did not work / judgement or luck: …
    How failure is defined / left on the table: …
    What to do after failure / repeatable conditions: …
    What to change next time / compliant: …
    Case 2: … (omit if there is no second case)
    Opportunity: <one line>

    [LEDGER UPDATES]
    #<id> <SUPPORT|OPPOSE|UNTESTED|KEPT|BROKEN> | <evidence>
    ADD <setup type code or GENERAL> <ENTRY|FAIL_DEF|FAIL_HANDLE|PROFIT_HANDLE|RISK|EXEC_GAP> <OPPORTUNITY|RESTRICTION|EXECUTION> | <condition → action> | <evidence>
    FINDING | <text, at most 160 characters> | <evidence, at most 120 characters>
    DELETE #<id> | <reason>
    Setup type codes are the English labels as they appear in the material (e.g. PULLBACK, BREAKOUT); separate fields with "|", one row per line, nothing else; DELETE applies to hypotheses only

  # Audit: one entry flagged by code, the model picks one of four outcomes
  audit:
    system: |-
      You are the same trader, now auditing one experience that code has flagged: it was opposed several times recently, or opposes caught up with supports, or it has gone untested for long.
      The user message carries the entry in full, its lifetime verdict log (each review's SUPPORT / OPPOSE / UNTESTED with evidence), its support rate, its longest opposing streak, and two groups of trades — supporting and opposing — each with entry / exit and entry context.
      Answer one question only: how do the recent opposes differ from the past supports. Pick one of four outcomes, and the reason must cite numbers from the log:
      - KEEP: the losing streak is within historical variance, the condition has not changed
      - REVISE: the opposes share a new feature, write it into the condition and give the new text
      - SPLIT: the original condition covers two situations with opposite outcomes, split into two new entries with their own conditions
      - RETIRE: condition unchanged, enough samples, outcome keeps reversing
      Write everything in English. One verdict line per entry, strictly in this format, nothing else:
      #<id> KEEP | <reason>
      #<id> REVISE | <new text, at most 160 characters> | <reason>
      #<id> SPLIT | <reason>
      ADD <setup type code or GENERAL> <ENTRY|FAIL_DEF|FAIL_HANDLE|PROFIT_HANDLE|RISK|EXEC_GAP> <OPPORTUNITY|RESTRICTION|EXECUTION> | <condition → action, at most 160 characters> | <evidence, at most 120 characters> | SOURCE #<id>
      #<id> RETIRE | <reason>
      Each entry produced by a SPLIT gets its own ADD line with "SOURCE #<id>", at least two of them
    opening: Below are the experiences flagged for audit, one block each.
    entry: "#{{id}} {{play}} {{slot}} {{dir}} | {{text}} | supported {{supports}} opposed {{opposes}} untested {{untested}} | support rate {{rate}}% | longest opposing streak {{streak}}"
    verdictRow: "- {{verdict}} | {{note}}"
    noVerdicts: (no verdict log yet)
    supportGroup: "[SUPPORTING TRADES] ({{n}})"
    opposeGroup: "[OPPOSING TRADES] ({{n}})"
    missingPosition: "- position #{{id}} (no longer in the recent records, id only)"
    keep: KEEP
    revise: REVISE
    split: SPLIT
    retire: RETIRE

  # Migration: the old free-text memory compressed into ledger rows, run once per trader
  migrate:
    system: |-
      You are the same trader. Your old review notes are free text; they now have to be compressed into the experience ledger.
      Keep only two kinds: patterns you derived from trades that are NOT in your owner's instructions (as hypotheses), and things the owner's instructions require that you kept failing to do (as execution gaps).
      Drop anything that restates or paraphrases the owner's instructions; drop anything without a specific trade or number as evidence. At most {{max}} rows.
      Write everything in English, only rows of this shape, one per line, nothing else:
      ADD <setup type code or GENERAL> <ENTRY|FAIL_DEF|FAIL_HANDLE|PROFIT_HANDLE|RISK|EXEC_GAP> <OPPORTUNITY|RESTRICTION|EXECUTION> | <condition → action, at most 160 characters> | <evidence, at most 120 characters>
    opening: "[OLD REVIEW NOTES] (free text, to be compressed into the ledger)"
    closing: Now compress the notes above into ledger rows.

  # Update-section mark. ExperienceOpParser slices on THIS language's set: the prompt just said which set to use, the other set is a format failure
  mark:
    updates: "[LEDGER UPDATES]"

  # Leading words of the ledger-update rows: the parser recognises this set only (current language)
  op:
    support: SUPPORT
    oppose: OPPOSE
    untested: UNTESTED
    kept: KEPT
    broken: BROKEN
    add: ADD
    finding: FINDING
    delete: DELETE
    general: GENERAL
    source: SOURCE
    slot:
      entry: ENTRY
      failDef: FAIL_DEF
      failHandle: FAIL_HANDLE
      profitHandle: PROFIT_HANDLE
      risk: RISK
      exec: EXEC_GAP
    dir:
      opportunity: OPPORTUNITY
      restriction: RESTRICTION
      execution: EXECUTION

  label:
    # ---- user message skeleton ----
    window: "Review window: {{from}} → {{to}}"
    windowStart: start of the round
    # Written by the owner, never translated, may be in another language
    ownerInstructions: "[YOUR OWNER'S TRADING INSTRUCTIONS] (the yardstick for judging this period's decisions; what they already say does not go into the ledger)"
    ownerInstructionsEmpty: (your owner wrote none — judge by common sense)
    closing: "Now write this period's review: answer the fixed questions per case first, then fill in the ledger-update table. Follow the two-section fixed format strictly."
    # The very last line of the user message, after the material and the ledger — which may be in another language
    outputLanguage: "Output language: English."

    # ---- scorecard ----
    statsHeader: "[SCORECARD] (computed by code; restate verbatim only, do not calculate anything yourself)"
    statsTruncated: "Note: this period's fill count may exceed the statistics cap of {{limit}}, so the closed-trade numbers below are an incomplete count — read a tendency from them, but do not treat them as a complete record to draw conclusions from"
    statsEquity: Starting equity {{start}} → closing equity {{end}}, return over the period {{pct}}%
    statsDrawdown: Max drawdown over the period {{dd}}%
    statsClosed: "{{n}} closed trades: {{wins}} won / {{losses}} lost (win rate {{winRate}}%), net P&L {{pnl}} (after fees and funding)"
    noClosed: No closed trades in this period

    # ---- close manner and holding time ----
    closeManner:
      liquidated: liquidated
      stopLoss: taken by stop
      takeProfit: taken by target
      manual: closed by hand
    duration:
      minutes: "{{n}}min"
      hours: "{{n}}h"
      days: "{{n}}d"

    # ---- case material ----
    casesHeader: "[CASE MATERIAL] (facts computed by code. Groups marked ★ are this period's cases, other groups get one line; fractions use the plan's original target / stop distance as denominator)"
    casesNone: No closed trades in the window
    caseGroup: "★ {{play}} ({{n}} trades, {{wins}} won, net {{net}})"
    caseGroupOther: "{{play}} ({{n}} trades, {{wins}} won, net {{net}})"
    caseGeneral: untyped
    caseTrade: "- {{symbol}} {{side}} {{opened}} → {{closed}} (held {{held}}) | entry {{entry}} stop {{stop}} target {{target}} exit {{exit}}, {{manner}} | net {{pnl}}, funding {{funding}}"
    casePath: "  Path: max favourable {{mfe}} ({{mfeAt}}, {{mfeFrac}} of target) | max adverse {{mae}} ({{maeFrac}} of stop) | minutes to 25% / 50% of target {{t25}} / {{t50}} | first close back through entry {{firstBack}} | best price 4h / 24h after exit {{best4}} / {{best24}}, {{targetAfter}}"
    caseTargetHit: later reached the original target
    caseTargetMiss: never reached the original target afterwards
    caseAfterShort: not enough data after the exit
    caseHourly: "  1h closes: {{closes}}"
    casePlan: "  Plan: thesis {{signals}} | invalidation {{invalidation}} | revisions {{revisions}}"
    caseNoPlan: "  Plan: (no plan record)"
    caseRevision: "{{type}} {{change}} ({{reason}})"
    caseCtx: "  Entry context: regime {{regime}} | 1h ATR {{atr}} | stop {{stopAtr}} ATR ({{stopPct}}%) | nearest High event {{eventMin}} min {{eventTitle}} | Beijing hour {{hour}} | funding {{funding}} | {{orderType}} {{leverage}}x"
    none: —

    # ---- this period's market ----
    marketHeader: "[THIS PERIOD'S MARKET] (per-symbol OHLC in the window, Beijing time; the low-to-high range is the reference for the opportunity audit)"
    marketRow: "- {{symbol}} {{open}} → {{close}}, low {{low}} ({{lowAt}}) high {{high}} ({{highAt}}), low to high {{range}}%"
    marketNoBars: "- {{symbol}}: no candle data in the window"

    # ---- experience ledger ----
    ledgerHeader: "[EXPERIENCE LEDGER] ({{n}} active; #id is what the ledger updates refer to; entries marked under review still get a verdict this period)"
    ledgerEmpty: "(the ledger is empty: this period can only add)"
    ledgerRow: "#{{id}} {{kind}} {{slot}} {{dir}} {{play}} | {{text}} | supported {{supports}} opposed {{opposes}} untested {{untested}} | evidence {{evidence}}{{flagged}}"
    ledgerFlagged: " | under review"
    findingsHeader: "[RECORDED FINDINGS] (already handed to the owner, do not add them again)"
    findingRow: "#{{id}} {{text}} | {{evidence}}"
    retiredHeader: "[RETIRED] (do not bring these ideas back)"
    retiredRow: "#{{id}} {{text}} | {{reason}}"
    # Header of the audit verdicts appended to the review body (written by code)
    auditAppendix: "[AUDIT VERDICTS]"

  # Persisted text: goes into ai_trader_decision.error and is on public display in the arena timeline
  error:
    timeout: Review timed out ({{seconds}}s)
    emptyOutput: The model returned nothing
    noOps: No ledger-update row could be parsed, the ledger was not updated
    auditFailed: The audit call failed, the under-review flags stay until next period
