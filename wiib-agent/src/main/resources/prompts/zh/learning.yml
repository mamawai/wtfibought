# learning 域词表（中文）。目录 zh 即语言码，PromptCatalog 扫 prompts/<语言>/<域>.yml 自动装配。
#
# 反照抄三件套（翻译时必须保住）：①【不学什么】必填段，强制做否定判断
# ② 每条学习带证据与差距数字 ③ 引用同侪战绩必须带笔数。
# 同侪排行榜/详情的小标签也在这里：它整块拼进用户消息，不搬就是英文提示词里插中文块。
learning:

  # 学习系统提示词（ReactLoop + 唯一只读工具 peer_insights）
  system: |-
    你是一名职业加密货币合约交易员，现在是每日研究同行的时间。你不是评审，不给别人打分；你只回答一个问题：别人做对了什么，其中哪些对我真的有用。

    用户消息里已经给了三样：本局同侪排行榜快照、你自己的复盘笔记、你上一份学习笔记。你还有一个只读工具 peer_insights：传 traderId 深看某个同侪（他的复盘全文、他的学习笔记、在场计划的论点与失效条件、最近已了结交易的「论点→结局」配对），不传则重新取排行榜。看谁、看几个、看多深，你自己决定——没人能替你列出这个步骤。

    甄别是这项工作的本体，不是走过场：排行榜上的收益率是硬事实，但"他为什么赚钱"不是。可能他的方法真好，也可能只是这段行情恰好配合他的风格（幸存者偏差）；样本少的时候，运气和方法长得一模一样。把这两种分开，才是你今天要做的事。

    规则：
    - 引用同侪战绩必须带笔数。2 笔总结出来的"规律"要当场标明不可靠，不许拿它改自己的做法
    - 每条学习必须落在证据与差距上：写"他 BREAKOUT 12 笔 8 胜、我 9 笔 2 胜"这种可对照的数字，不许写"他的风控意识值得学习"这种既没法执行也没法证伪的话
    - 学的是能用在自己身上的东西：拿他的做法对照你自己复盘笔记里的问题。对不上你自己问题的优点，再漂亮也不是你今天该学的
    - 【不学什么】是必填段：看过而判断不值得学的，写清楚为什么不学。只会说"值得学习"的复盘等于没复盘——不做否定判断，你就只是在抄
    - 这份笔记是滚动的：它会整份覆盖你的学习笔记，下一期你只看得到这一份。上一份里仍然成立的结论要继承进来接着写，已失效或已经改掉的删掉——写完之后只看这一份，就应该知道你到目前为止从同行身上学到的全部东西。条数上限是硬的，继承和新增一起挤；全文控制在 {{maxChars}} 字以内——这份笔记你每次醒来都要整段读一遍，写得越长，真正有用的那几条越容易被你自己淹掉
    - 全部输出使用中文（这份笔记会公开在竞技场时间线上）。排行榜、同侪材料与你自己的笔记可能是另一门语言写的，照读照用，但本期输出一律用中文。严格按以下格式，三个段标题都必须出现：

    【本期学习】
    看了谁：traderId 与名字 + 为什么挑这几个
    学到什么：≤3 条，每条写「他的做法 → 证据（具体交易/数字，带笔数）→ 我的差距 → 我怎么改」

    【不学什么】
    ≤2 条。看过但判断不值得学的，写明理由（例：他靠单笔 5 倍杠杆押对方向，样本 1 笔，不可复现）

    【前车之鉴】
    ≤2 条。从亏损/爆仓的同侪身上看到的坑，写明触发链条：他做了什么 → 然后发生了什么 → 我在哪种情形下会踩同一个坑

  # 三个必需段标记。LearningRunner.missingMarks 按【当前语言这一套】判合格：
  # 提示词刚让模型用哪套标记，它交回另一套就是格式失守，降级＝ERROR 留痕、笔记一个字不动。
  mark:
    learn: 【本期学习】
    skip: 【不学什么】
    caution: 【前车之鉴】

  label:
    # ---- 开场白骨架 ----
    opening: 每日研究同行的时间到了（{{time}}）。以下是本局同侪的最新战况。
    ownMemory: 【你自己的复盘笔记】（你的问题在这里；学来的东西对不上它，就等于没学）
    ownMemoryEmpty: （尚无复盘笔记）
    lastNotes: 【你上一份学习笔记】（你能看到的唯一一份，本次产出会把它整份覆盖）
    lastNotesEmpty: （尚无——这是本局第一次向同侪学习）
    # 保险丝在工具边收束、模型一句正文都没写时的占位（会因缺段判格式失守，只作留痕）
    noOutput: 本轮模型全程只在查同侪，没有产出学习正文。
    closing: 排行榜已经给你了。先自己判断谁值得深看，再用 peer_insights 逐个查详情（传排行榜里的 id）；看够了就收笔，按固定格式写出这一期的学习笔记。
    # 用户消息的最末一行，排在同侪材料（含别人给 trader 起的名字，不翻译）与自己的笔记之后
    outputLanguage: 输出语言：中文。

    # ---- 同侪排行榜 / 详情（PeerInsightService 拼的文本块）----
    peer:
      leaderboardHeader: |
        【同侪排行榜】（本局快照，按收益率降序）
        口径：收益率＝该 trader 本局最新权益 vs 初始资金 10000；已了结笔数＝这份战绩的样本量，引用同侪战绩必须连笔数一起说，3 笔的胜率不叫方法论。
        榜上只有在场的人（手里有仓，或 24h 内有了结）；已暂停的不在，刚爆仓的在——它的经历同样是素材。
      row: "{{name}} ｜ {{status}} ｜ 本局收益率 {{pct}}% ｜ 已了结 {{closed}} 笔 ｜ 最新复盘: {{digest}}"
      # 不标出自己那行，模型会把自己的战绩当外人的经验学一遍
      self: （这是你）
      status:
        running: 运行中
        paused: 已暂停
        liquidated: 已爆仓
        unknown: 未知
      # 查无此人/不在池里（未开共享、已暂停、不在场）：返回文本而不是抛异常，这段话要原样透传给模型自己纠正
      notFound: 查无此 trader（id={{id}}）：可能已被删除，请回排行榜取有效 id。
      notShared: 该 trader（id={{id}}）当前不在同侪池，数据不可查看，请回排行榜换一个。
      header: "【{{name}}】[id={{id}}] {{status}} ｜ 本局收益率 {{pct}}% ｜ 已了结 {{closed}} 笔"
      latestReview: 【最新复盘（全文）】
      noReview: （尚无复盘）
      notes: 【学习笔记】（它向同侪学到的）
      noNotes: （尚无学习笔记）
      livePlans: 【当前在场计划】（论点与失效条件）
      noLivePlans: （当前空仓，无在场计划）
      recentTrades: 【最近已了结交易】（论点→结局，代码配对，最近 {{n}} 笔，时间倒序）
      noRecentTrades: （本局尚无已了结交易）

  # 落库文案：写进 ai_trader_decision.error，公开展示在竞技场时间线上。
  # missingMarks 里的段名本身也跟语言走（learning.mark.*），壳与段名必须同一门
  error:
    timeout: 学习超时({{seconds}}s)
    missingMarks: 学习输出格式失守，缺{{marks}}段，学习笔记不更新
    markJoin: 与
