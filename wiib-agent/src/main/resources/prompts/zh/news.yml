# 快讯翻译域词表（中文）。目录 zh 是语言码，PromptCatalog 按 prompts/<语言>/<域>.yml 装配。
#
# 这里有两件事，不要混为一谈：
#  * 译文是哪门语言——固定英文，两份文案里都写死。翻译是平台后台任务（模型取自 ai_runtime_config），
#    没有"当前用户"，不跟 user.lang 走。
#  * 提示词本身用哪门语言——NewsTranslator 里的一个常量，当前取 en 那份：整篇英文是"译文写英文"
#    最稳的信号。这份中文版是同一件活的中文写法，换常量即换过来。
news:

  # 一次轻模型调用译一批。{{flashes}}=本批快讯，一条一行
  translate: |-
    你负责把中文金融快讯译成英文。对下面每条快讯，把标题与正文译成自然的英文。
    原文写什么译什么：不概括、不补充、不评论，数字/代码/专有名词照抄。
    某条译不出就整个字段不给，不要把中文原样填回去——调用方分得清"字段空着"与"译文"，
    却分不清"中文冒充英文"与"本来就没译"。

    只输出 JSON 数组，不要任何其他文字，格式：
    [{"id":快讯id,"title_en":"...","content_en":"..."},{"id":快讯id,"title_en":"...","content_en":"..."}]

    快讯列表：
    {{flashes}}

  # {{flashes}} 里的一条一行。这里的小标签必须跟提示词同语言——英文提示词里插中文段名，
  # 产出语言就是从这种地方开始飘的
  flashLine: "id={{id}} 标题：{{title}} 正文：{{content}}"
