# behavior 域词表（中文）。目录 zh 即语言码，PromptCatalog 扫 prompts/<语言>/<域>.yml 自动装配。
# key 带域前缀（这里第一层就是 behavior:），分了文件也不去掉——同一门语言全部文件压进同一张表，
# 去掉前缀会跨文件撞 key（撞了当场炸）。长文本用 | 块标量（换行原样进提示词）；
# 占位符写 {{name}}，与前端 i18next 同款，取词时少给一个值就抛。
# 中文=回落语言：别的语言缺哪条就回落到这份，所以这份不许缺。

behavior:
  # 一次性行为分析的系统指令。{{schema}} 由代码注入（BehaviorAnalysisReport 自动生成的 JSON Schema）
  system: |
    你是专业的用户行为分析师。下面会一次性给出该用户各维度的原始数据（JSON），请据此全面分析：
    1. 交易行为：加密货币现货、bStock 代币化美股、合约（分加密/大宗商品/TradFi 美股三个品类评述）、Prediction
    2. 风险画像：根据杠杆使用、破产历史判断风险等级(保守/稳健/激进/赌徒)
    3. 给出针对性建议

    某段数据形如 {"error": ...} 表示该维度这次没取到：对应数值填 0，并在建议里点明这块数据缺失，不要臆造。
    报告里所有文本字段（建议、风险等级、分类名等）一律用中文写。
    输出必须是严格符合下述 JSON Schema 的 JSON，不要输出任何其他文字：
    {{schema}}

  # 用户消息开头，后面按段拼各维度原始数据
  intro: |
    分析用户#{{userId}}的全部行为数据，以下是该用户各维度的原始数据：

  # 段标题：key 就是 sim 的 internal 端点名，模型只靠它认这段 JSON 是什么
  section:
    user-profile: 用户基础信息（余额、冻结余额、破产次数、注册时间）
    portfolio-summary: 实时资产概览（总资产、持仓市值、杠杆负债、盈亏，精确计算含实时价格）
    asset-snapshots: 近30日资产快照（每日总资产与各品类盈亏趋势）
    crypto-stats: 加密货币交易统计（买入总额、卖出总额、持仓数、杠杆使用情况）
    bstock-stats: bStock(代币化美股)交易统计（持仓数、买入总额、卖出总额）
    futures-stats: 合约交易统计（已实现盈亏、订单数、多空偏好、平均杠杆、止损率、爆仓次数，含分品类拆解(crypto加密/commodity大宗金油/tradfi美股ETF)）
    prediction-stats: Prediction统计（参与次数、净盈亏、胜率、方向偏好）

  # 阶段进度：工具跑在对话里，这两条推给 SSE 让用户看见跑到哪了（原来只进日志，随口写中文即可，
  # 现在是给用户看的字，得跟语言走）
  progress:
    collecting: 正在采集你的行为数据 {{done}}/{{total}}
    analyzing: 数据已齐，正在生成行为分析报告

  # 准入层的失败回执。它既回给模型（据此向用户解释），也可能被模型原样引用
  error:
    busy: 当前分析人数已满，请稍后再试
    runFailed: 分析执行失败：{{msg}}
    parseFailed: 分析结果解析失败
    incomplete: 分析结果不完整，请重试
