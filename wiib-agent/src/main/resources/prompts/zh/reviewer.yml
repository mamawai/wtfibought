    watchUnreported: 命中后还没有哪轮唤醒告诉过它
    watchNoAction: 无
    watchRejected: "{{tool}}（被拒）"
    watchFailed: "{{tool}}（失败）"
    watchUnknown: "{{tool}}（结果未知）"
    watchNotAttempted: "{{tool}}（未发起）"
    watchLiquidated: "{{tool}}（仓位已强平）"

    # ---- 经验账本 ----
    ledgerHeader: 【经验账本】（现役 {{n}} 条；#编号用于经验更新；每条后面是代码按名下单子记的账）
    # 账本名额占了多少（上限在 ExperienceLedger），紧跟在块头下面
    ledgerQuota: "名额：现役 {{n}}/{{max}} 条；同一单子类型最多 {{perPlay}} 条{{fullPlays}}；限制型 {{r}}/{{rMax}} 条{{rIds}}。满了的那一类再写新增不会记进账本"
    ledgerQuotaFull: "（已满：{{plays}}）"
    ledgerQuotaIds: "（{{ids}}）"
    listSep: "、"
    ledgerEmpty: （账本为空：本期只能新增）
    ledgerRow: "#{{id}} {{kind}} {{slot}} {{dir}} {{play}} ｜ {{text}} ｜ {{tally}} ｜ 证据 {{evidence}}"
    # 假设和规律的账：名下累计、当前段（转正、降级各起一段）
    ledgerTally: "名下 {{n}} 笔，赚 {{wins}} 亏 {{losses}}，合计 {{net}}，{{days}} 天；当前段 {{segN}} 笔，合计 {{segNet}}，{{segDays}} 天{{miscited}}"
    # 引用不符大于 0 才跟在上一行后面
    ledgerTallyMiscited: "；引用不符 {{m}} 次"
    # 执行缺口的账
    ledgerTallyGap: "守 {{kept}} 次，破 {{broken}} 次"
    # 条目行下面：本期哪些单子开仓那轮的结论里引用了它，不管单子是什么类型
    ledgerCited: "  本期开仓那轮引用了它的单子：{{trades}}"
    ledgerCitedTrade: "[{{id}}] {{symbol}} {{side}} {{play}} {{opened}} 净 {{net}}"
    findingsHeader: 【已记录的发现】（已给主人，不要重复新增）
    findingRow: "#{{id}} {{text}} ｜ {{evidence}}"
    retiredHeader: 【退役名单】（不要再提出同样的念头）
    retiredRow: "#{{id}} {{text}} ｜ {{reason}}"
    # 代码结账（转正、降级、闲置退役）追加在复盘正文末尾的段头（代码写），下面一行一条
    settledAppendix: 【代码记账】下面这些是代码按名下单子的账做的：
    settledPromoted: "#{{id}} 转为规律（当前段名下 {{n}} 笔，{{days}} 个平仓日，合计 {{net}}）：{{text}}"
    settledDemoted: "#{{id}} 降回假设（转正后名下 {{n}} 笔，合计 {{net}}）：{{text}}"
    settledRetired: "#{{id}} 退役（连续 {{n}} 篇复盘名下没有新单子）：{{text}}"
    # 名额满了没记进账本的新增，追加在复盘正文末尾的段头（代码写），下面一行一条
    overCapAppendix: 【没记进账本】下面几条新增因为账本名额已满，没有记进账本：

  # 代码自动退役写进 retire_reason 的理由：复盘的退役名单和主人页都看得到
  retire:
    idle: 连续 {{n}} 篇复盘名下没有新单子，代码退役

  # 落库文案：写进 ai_trader_decision.error，公开展示在竞技场时间线上
  error:
    timeout: 复盘超时({{seconds}}s)
