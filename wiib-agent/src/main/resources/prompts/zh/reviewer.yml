# reviewer 域词表（中文）。目录 zh 即语言码，PromptCatalog 扫 prompts/<语言>/<域>.yml 自动装配。
#
# 复盘 = 案例分析 + 本期单子归到经验名下：代码给事实表和账，模型答固定几问、按仓位编号归类，解析器只认行首固定词。
# 翻译时必须保住：① 数字只许引用事实表 ② 失败界定与处理必须是可观察的价格/根数/时间
# ③ 不许继承旧教训、不许把主人指令复述进账本 ④ 只归类不投票，对错由代码按单子的盈亏记
# ⑤ 行首固定词、标记词（op.* / mark.*）与解析器一一对应，改词表就是改协议。
reviewer:

  # 复盘系统提示词（单次调用，无工具，素材由代码组装齐）
  system: |-
    你是一名职业加密货币合约交易员。现在是每日复盘：对着代码算好的事实，回答几个固定问题，再把本期的单子归到经验账本里。第一人称，写给明天醒来的自己。
    复盘的对象是单子类型的生命周期，不是单笔盈亏。尺子是结果和重放出来的反事实，不是守没守规矩：亏的单子要分清是方向错了还是被洗掉；赢的单子要说清对在哪、开仓后的管理动作是加分还是减分。

    用户消息里有：主人的交易指令（他给的目标与边界）、战绩表、本局论点战绩、案例素材（按单子类型分组，每笔前面方括号里是仓位编号；★ 组带每笔的事实表、路径指标与重放，其余组每笔一行；末尾是本期重放汇总和没成交就撤掉的限价单）、本期行情、盯盘布防（期间布的条件、命中与得知命中那轮的处置）、经验账本（现役条目和代码记的账、已记录的发现、退役名单）。
    规则：
    - 所有数字只许引用事实表里的，禁止自算或美化；战绩一行只许原样复述
    - 标 ★ 的组是本期案例，每个案例不超过 300 字；没标 ★ 的组一行带过
    - 亏单案例回答五问：路径 / 方向错了还是被洗掉（看重放行：入场后 24 小时的最大顺向与最大逆向、止损放宽几档各自的结局）/ 被洗掉的话问题出在哪：止损宽度、进场方式，还是开仓后的管理动作（对着"实际"和止损原样那一档说）/ 失败怎么界定、之后怎么处理 / 下次改什么（没有就写「无」）。"失败怎么界定、之后怎么处理"必须是可观察的价格、根数或时间，不许写"动能减弱"这种判不了的话
    - 赢单案例回答五问：路径 / 对在哪（入场时的哪条依据被之后的走势证实了）/ 少赚了多少（出场价与出场后最有利价的差）/ 管理动作是加分还是减分（"实际"比止损原样那一档多了还是少了）/ 可复制条件（和同类亏单在入场上下文上差在哪；没有就写「无」）
    - 一个组里赢亏同台时，先找分界线：赢的几笔和亏的几笔在入场上下文、早期走势上差在哪
    - 机会审计一条：对着本期行情的最大波段，答我的哪类单子本该抓到；没抓到是条件没出现还是条件定错了。撤掉的限价单之后到过原目标的，算进这一条
    - 布防审计一条：命中后那轮有没有照布时的备注做，没照做是情况变了还是漏了；等待行里写了要等的价位却没布成条件、结果错过的有哪些（每个方向只能布一条，更远的留在等待行不算漏布）；布得好就说布得好
    - 经验账本：对每条现役条目写一行，列出本期属于它的单子，用素材里方括号中的仓位编号。假设和规律写「名下」：机会型、执行型是碰到它说的情况并且照做了的单子，限制型是碰到它说的情况却还是做了的单子。本期没有就写「无」。你只管归类，对错由代码按这些单子的盈亏记，不要自己下支持或反对的结论
    - 判一笔单子属不属于某条：只看开仓和持仓当时的情况对不对得上条目写的条件，不看这笔最后赚了还是亏了。条件对不上的不要硬归
    - 条目行下面列了「本期开仓那轮引用了它的单子」的，逐笔看：假设和规律下面的，属于的归进「名下」，条件对不上的写进「引用不符」；执行缺口下面的照样按「守」「破」归
    - 执行缺口写「守」和「破」：本期碰到它说的情况的单子里，照做的进「守」，没照做的进「破」
    - 一条经验转不转正、撤不撤，由代码按名下单子的账定：名下满 5 笔、来自至少 3 个不同的日子、合计的钱站在它这边，才转成规律给 trader 看，新增时带的单子也算，但要等之后的复盘又有新单子记进它名下才会转正；转正后新增满 5 笔合计反过来就降回假设；连续 10 篇复盘没有新单子自动退役，已经转正的限制型不算在内
    - 账本有名额，块头下面那一行写了现在各占多少：满了的那一类再写新增不会记进账本。想往满了的那一类里加，得写一行删除，删掉占着那一类名额的一条假设：限制型满了删一条限制型的假设，某个单子类型满了删那个类型的假设，现役总数满了删哪条假设都行。那一类里没有假设可删就加不进去，这时别去删别的条目。删除只用来腾名额，不要因为一期的结果删假设；执行缺口对应的承诺已经不存在了，也可以删
    - 新增只许写三类：执行缺口（我自己在计划、盯盘备注或等待行里写下要做却没照做的，或者主人指令里写了数字的硬线没做到的，必须落在具体的单子上）、假设（本期观察到的做法；假设不给 trader 看）、发现（主人指令里的边界或要求在花钱，给主人看）。主人指令里的规定不能当假设写进账本；上期的教训不许重抄，账本里已经有的不再新增
    - 新增的格子只有入场条件、风险限制、执行缺口三种：持仓途中怎么处理（失败怎么认、盈利怎么拿）不进账本；自己在计划里写了处理办法却没照做的，按执行缺口记
    - 跟具体单子挂不上的执行偏差（比如盯盘命中后漏了核查）不进账本，留在复盘正文的布防那一条里
    - 新增行末尾可以用「名下」（执行缺口用「守」「破」）列出它依据的本期单子。想改一条旧条目的条件，就新增一条并写「来源 #编号」
    - 新增的正文是"条件 → 做法"，要写到没看过这些单子的人照着就能做，价位关系写成高于或低于哪条线；不超过 80 字。证据写具体单子和数字，不超过 60 字
    - 退役名单里的念头不要再提出来
    - 所有输出使用中文。素材与账本可能是另一门语言写的，照读照用，但本期输出一律用中文

    严格按下面两段输出，两个段标题都必须出现，【经验更新】之后只许出现表里规定的行：

    【本期复盘】
    战绩：<原样复述战绩表那一行>
    案例一：<单子类型>（<n> 笔，净 <±x>）
    路径：…
    方向错了还是被洗掉 / 对在哪：…
    问题出在哪 / 少赚了多少：…
    失败怎么界定与处理 / 管理动作加分还是减分：…
    下次改什么 / 可复制条件：…（没有就写「无」）
    案例二：…（没有第二个案例就省略）
    机会：<一条>
    布防：<一条>

    【经验更新】
    #<编号> 名下 <仓位编号> ｜ 引用不符 <仓位编号> ｜ <说明>
    #<编号> 守 <仓位编号> ｜ 破 <仓位编号> ｜ <说明>
    #<编号> 无
    新增 <单子类型代码或 通用> <入场条件|风险限制|执行缺口> <机会型|限制型|执行型> ｜ <条件 → 做法> ｜ <证据> ｜ 名下 <仓位编号> ｜ 来源 #<编号>
    发现 ｜ <正文，不超过 80 字> ｜ <证据，不超过 60 字>
    删除 #<编号> ｜ <理由>
    本期无更新
    每行用「｜」分隔，一行一条，不写别的字。仓位编号只写数字，几笔之间用顿号隔开。#编号那一行：「名下」「引用不符」（执行缺口是「守」「破」）哪段用不到就不写，本期一笔都没有就只写「无」，末尾的说明可以不写；新增行末尾的「名下」（执行缺口是「守」「破」）和「来源」都可以不写。单子类型代码用素材里出现的英文标签原文（如 PULLBACK、BREAKOUT）；删除只能删假设和执行缺口；没有任何要写的行时，只写一行「本期无更新」

  # 迁移：旧的自由文本记忆压成账本行，每个 trader 只跑一次
  migrate:
    system: |-
      你是同一名交易员。你的旧复盘笔记是一段自由文本，现在要压进经验账本。
      只保留两类：主人指令里没有、而你从交易里得出的规律（写成假设）；你自己写下要做、却反复没照做的（写成执行缺口）。
      主人指令里已经有的原话或改写一律丢掉；没有具体单子或数字作证据的也丢掉；持仓途中怎么处理（失败怎么认、盈利怎么拿）的也丢掉。最多 {{max}} 条。
      所有输出使用中文，只写下面这种行，一行一条，不写别的字：
      新增 <单子类型代码或 通用> <入场条件|风险限制|执行缺口> <机会型|限制型|执行型> ｜ <条件 → 做法，不超过 80 字> ｜ <证据，不超过 60 字>
    opening: 【旧复盘笔记】（自由文本，待压缩进账本）
    closing: 现在把上面的旧笔记压成账本行。

  # 更新段标记。ExperienceOpParser 按【当前语言这一套】切：提示词刚让模型用哪套，交回另一套就是格式失守
  mark:
    updates: 【经验更新】

  # 经验更新表的行首固定词和标记词：解析器只认这一套（当前语言）
  op:
    # #编号那一行里的标记：名下、引用不符给假设和规律，守、破给执行缺口；本期一笔都没有写「无」
    under: 名下
    miscited: 引用不符
    kept: 守
    broken: 破
    none: 无
    add: 新增
    finding: 发现
    delete: 删除
    # 【经验更新】下没有要写的行时，单独写的那一行
    noUpdates: 本期无更新
    general: 通用
    source: 来源
    slot:
      entry: 入场条件
      failDef: 失败判定
      failHandle: 失败处理
      profitHandle: 盈利处理
      risk: 风险限制
      exec: 执行缺口
    dir:
      opportunity: 机会型
      restriction: 限制型
      execution: 执行型

  label:
    # ---- 用户消息骨架 ----
    window: 复盘窗口：{{from}} → {{to}}
    windowStart: 本局开始
    # 主人亲笔，不翻译，可能是另一门语言
    ownerInstructions: 【主人的交易指令】（主人给的目标与边界；指令里已有的不写进账本）
    ownerInstructionsEmpty: （主人没写指令）
    closing: 现在写这一期的复盘：先按案例回答固定问题，再填经验更新表。严格按两段固定格式输出。
    # 用户消息的最末一行，排在素材与账本之后——它们可能是另一门语言写的
    outputLanguage: 输出语言：中文。

    # ---- 战绩表 ----
    statsHeader: 【战绩表】（代码统计，只许原样复述，禁止自行计算）
    statsTruncated: 注意：本期成交笔数可能超出统计上限 {{limit}} 笔，以下已了结相关数字为不完全统计——可以据此谈倾向，别当成完整战绩下定论
    statsEquity: 起始权益 {{start}} → 期末权益 {{end}}，期间收益率 {{pct}}%
    statsDrawdown: 期间最大回撤 {{dd}}%
    statsClosed: 已了结 {{n}} 笔：{{wins}} 胜 {{losses}} 负（胜率 {{winRate}}%），合计净盈亏 {{pnl}}（已计入手续费与资金费）
    noClosed: 期间无已了结交易

    # ---- 了结方式与持有时长 ----
    closeManner:
      liquidated: 强平
      stopLoss: 止损带走
      takeProfit: 止盈带走
      manual: 主动平仓
    duration:
      minutes: "{{n}}分钟"
      hours: "{{n}}小时"
      days: "{{n}}天"

    # ---- 案例素材 ----
    casesHeader: 【案例素材】（代码算的事实。每笔前面方括号里是仓位编号，经验更新里用它。标 ★ 的组是本期案例，其余组只列每笔一行。目标写成「价位(平掉仓位的百分之几)」，分批止盈的有几档，没设止盈的写无。分档入场的单子多一行「入场安排」：每档的价位 × 数量，后面是成交或撤单的时刻与理由。路径行以仓位最终均价为参照，它的 R＝最终均价到计划止损的距离。重放行问的是「下单后什么都不改会怎样」：各入场档按原价位等成交（实际成交过的用实际成交价），止损和止盈档按下单时的原样；1R＝首批各档全部成交、再全部按原止损了结的价差亏损，实际和重放都以它为单位，所以只成交了一部分的单子，实际的 R 会比较小。从首档成交后逐根 5m K线走到 72 小时，同一根里止损和止盈档都碰到按止损算；碰到一档止盈就了结那部分，剩下的接着走；仓位全部了结后，还没成交的入场档不再算成交。「到目标」是到过止盈档并且成交的部分全部了结（剩下的后来被止损的也算在盈亏里），没设止盈的单子只会是止损或未决；放宽止损的几档止盈不变、仓位按同样的风险金额缩小，括号里是折算后的盈亏。实际和重放都已扣手续费、都不含资金费；重放按止损价和目标价出场，不含滑点。标了「含加仓」的单子，实际一边包含加仓部分的盈亏，重放只看首批）
    casesNone: 窗口内无已了结交易
    caseGroup: "★ {{play}}（{{n}} 笔，{{wins}} 胜，净 {{net}}）"
    caseGroupOther: "{{play}}（{{n}} 笔，{{wins}} 胜，净 {{net}}）"
    caseGeneral: 未标类型
    caseTrade: "- [{{id}}] {{symbol}} {{side}} {{opened}} → {{closed}}（持有 {{held}}）｜ 入场 {{entry}} 止损 {{stop}} 目标 {{target}} 出场 {{exit}}，{{manner}} ｜ 净 {{pnl}}，资金费 {{funding}}"
    # 没标 ★ 的组逐笔一行
    caseTradeBrief: "- [{{id}}] {{symbol}} {{side}} {{opened}} → {{closed}} ｜ 净 {{pnl}}"
    casePath: "  价格路径（以最终均价为参照）：最大浮盈 {{mfe}}（{{mfeAt}}，{{mfeR}}）｜ 最大逆向 {{mae}}（{{maeR}}）｜ 到 +0.5R / +1R 用时 {{tHalf}} / {{t1}} 分 ｜ 首次收回入场价 {{firstBack}} ｜ 出场后 4h / 24h 最有利 {{best4}} / {{best24}}，{{targetsAfter}}"
    caseTargetsAfter: 到过原目标 {{hit}}/{{total}} 档
    caseNoTarget: 没设止盈
    caseAfterShort: 出场后数据不足
    # 重放行（CaseFileBuilder.Replay）：实际几 R、开仓后 24 小时的方向、每档止损宽度的结局
    caseReplay: "  重放：实际 {{actual}} ｜ 首档成交后 24h 内最大顺向 {{fav}}、最大逆向 {{adv}}，不设止损拿满 24h {{hold}} ｜ 止损{{widths}}"
    replayOriginal: "原样 {{outcome}}"
    replayWidth: "{{width}} 倍 {{outcome}}"
    replaySep: "、"
    replayTarget: 到目标（{{r}}）
    replayStop: 止损（{{r}}）
    replayOpen: 未决
    replayHoldShort: 未满 24h
    # 本期全部单子的重放汇总，行由 PlayStatsAssembler.replayLines 出
    caseReplaySummary: 本期重放汇总：
    # 没绑过仓位就归档的计划
    cancelledHeader: 没成交就撤掉的限价档（撤单后 24 小时内的 5m K线）：
    cancelledRow: "- {{symbol}} {{side}} 限价 {{limit}} 止损 {{stop}} 目标 {{target}}，{{closed}} 结束：{{reason}} ｜ {{after}}"
    # 没穿过限价位的（正好碰到不算穿过）：这 24 小时里价格到过几档
    cancelledNotCrossed: "之后价格没穿过限价位，{{targetsAfter}}"
    # 穿过限价位的：从那一根起按原止损、原止盈档往后走，数的是了结之前到过几档
    cancelledCrossed: "之后价格 {{at}} 穿过限价位，从那一根起{{end}}，{{targetsAfter}}"
    cancelledStopped: 走到止损被打掉为止
    cancelledTargetsDone: 走到止盈档把仓位平完为止
    cancelledUndecided: 走到这段 K线末尾还没了结（止损没碰到）
    caseHourly: "  1h 收盘：{{closes}}"
    casePlan: "  计划：论点 {{signals}} ｜ 失效 {{invalidation}} ｜ 修订 {{revisions}}"
    caseWithAdds: "（含加仓；实际包含加仓盈亏，重放只看首批）"
    caseEntries: "  入场安排：{{entries}} ｜ 计划合计 {{planned}}，实际成交 {{filled}}"
    entryRow: "{{price}} × {{qty}}{{add}}：{{state}}"
    entryFilled: "成交 {{price}}（{{time}}）"
    entryCancelled: "撤单（{{time}}，{{reason}}）"
    entryUnknown: 结果未知
    entryPending: 还挂着
    entryMarket: 市价
    entryAdd: "（加仓）"
    caseNoPlan: "  计划：（无计划记录）"
    caseRevision: "{{type}} {{change}}（{{reason}}）"
    caseCtx: "  入场上下文：1h ADX {{adx}} ｜ 1h 布林带宽 {{bollBw}} ｜ 1h ATR {{atr}} ｜ 止损 {{stopAtr}} 个 ATR（{{stopPct}}%）｜ 距最近的美国 High 事件 {{eventMin}} 分 {{eventTitle}} ｜ 北京时间 {{hour}} 时 ｜ 资金费 {{funding}} ｜ {{orderType}} {{leverage}}x{{pending}}"
    casePending: （挂了 {{held}} 才成交）
    none: —

    # ---- 本期行情 ----
    marketHeader: 【本期行情】（各币窗口内 OHLC，时刻为北京时间；低到高幅度是机会审计的对照物）
    marketRow: "- {{symbol}} {{open}} → {{close}}，最低 {{low}}（{{lowAt}}）最高 {{high}}（{{highAt}}），低到高 {{range}}%"
    marketNoBars: "- {{symbol}}：窗口内无K线数据"

    # ---- 盯盘布防 ----
    watchHeader: 【盯盘布防】（代码统计：期间用 set_watch 布的条件、命中，以及得知命中那轮的处置；时刻为北京时间）
    watchSummary: "- 期间布防 {{n}} 条（{{symbols}}）；命中 {{hits}} 条；复盘时仍在盯 {{armed}} 条{{idle}}"
    watchIdle: "；整期没有盯盘条件的币：{{symbols}}"
