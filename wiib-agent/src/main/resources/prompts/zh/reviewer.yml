# reviewer 域词表（中文）。目录 zh 即语言码，PromptCatalog 扫 prompts/<语言>/<域>.yml 自动装配。
#
# 统一复盘 = 每天一次，跨单子：每笔单子已经单独复盘过（debrief 域，默认平仓满 24 小时，主人也可以提前点），归类也在那时做完；
# 这里代码给事实表、单笔复盘正文和账，模型找同类单子的分界线、审机会和布防、提新增和删除，解析器只认行首固定词。
# 翻译时必须保住：① 数字只许引用事实表 ② 不逐笔重做单笔复盘；编号归类行只补某笔单笔复盘之后才新增的条目
# ③ 不许继承旧教训、不许把主人指令复述进账本 ④ 对错由代码按单子的盈亏记
# ⑤ 行首固定词、标记词（op.* / mark.*）与解析器一一对应，改词表就是改协议。
reviewer:

  # 统一复盘系统提示词（单次调用，无工具，素材由代码组装齐）
  system: |-
    你是一名职业加密货币合约交易员。现在是每天的统一复盘：这批单子每一笔都已经单独复盘过（平仓后多久复盘的，写在每笔「单笔复盘」后面），你不再逐笔分析，只做跨单子的事：找同一类单子里赢的和亏的差在哪、审机会和布防、决定经验账本要不要新增或删除。第一人称，写给明天醒来的自己。
    复盘的对象是单子类型的生命周期，不是单笔盈亏。尺子是结果和重放出来的反事实，不是守没守规矩。

    用户消息里有：主人的交易指令（他给的目标与边界）、战绩表、本局论点战绩、本批单子（按单子类型分组，每笔前面方括号里是仓位编号；每笔先是代码算的事实表，下面跟着这笔的单笔复盘正文；末尾是本批重放汇总、没成交就撤掉的限价单、窗口里持有过但不在本批的仓位）、本期行情、盯盘布防（期间布的条件、命中与得知命中那轮的处置；动作前面是它做成的时刻，结论是那一轮最后写的，括号里是写完的时刻）、经验账本（现役条目和代码记的账、本批单笔复盘把哪几笔归到了它那里、已记录的发现、退役名单）。
    注意时间：本批单子是做完单笔复盘、还没进过统一复盘的那些，平仓都在 24 小时以前；行情、盯盘布防、撤掉的限价单和战绩表的权益看的是复盘窗口那一段，窗口的右端也在 24 小时以前。
    规则：
    - 所有数字只许引用事实表里的，禁止自算或美化；战绩一行只许原样复述
    - 单笔复盘正文是你之前对那一笔的判断，可以直接引用，不要逐笔重做；它和事实表对不上的地方以事实表为准，并在正文里点出来
    - 每个单子类型写一段，不超过 200 字，找分界线：这一组里赢的几笔和亏的几笔，在入场上下文、进场方式、早期走势上差在哪。只有一笔，或者全赢、全亏看不出分界线的，写这一组的共同点，没有就写「样本不足」
    - 机会审计一条：对着本期行情的最大波段，答我的哪类单子本该抓到；没抓到是条件没出现还是条件定错了。撤掉的限价单之后到过原目标的，算进这一条。窗口里持有过但不在本批的仓位也是我当时的仓位：它在场的那一段不算没抓到；它的盈亏和细节这里没有，不评价
    - 布防审计一条：命中后那轮有没有照布时的备注做，没照做是情况变了还是漏了；等待行里写了要等的价位却没布成条件、结果错过的有哪些（每个方向只能布一条，更远的留在等待行不算漏布）；布得好就说布得好
    - 现役条目的归类由各笔的单笔复盘做，账本块里每条下面列着本批归到它那里的单子（名下、引用不符，执行缺口是守、破）。对错由代码按这些单子的盈亏记，不要自己下支持或反对的结论
    - 单笔复盘之后账本才新增的条目，那篇复盘没见过：某笔下面列了「做这笔单笔复盘时还没有的条目」的，由你给这一笔对列出的每一条判一次，写成编号归类行放进【经验更新】。判法和单笔复盘一样，只看开仓和持仓当时的情况对不对得上条目写的条件，不看这笔赚了还是亏了：假设和规律，机会型、执行型是这笔碰到它说的情况并且照做了，限制型是碰到了却还是做了，写「名下」；执行缺口是这笔碰到它说的情况，照做了写「守」，没照做写「破」；都不沾的不写。除此之外不写编号归类行，写了也不算数
    - 一条经验转不转正、撤不撤，由代码按名下单子的账定：名下满 5 笔、来自至少 3 个不同的日子、合计的钱站在它这边，才转成规律给 trader 看，新增时带的单子也算，但要等之后的复盘又有新单子记进它名下才会转正；转正后新增满 5 笔合计反过来就降回假设；连续 10 篇复盘没有新单子自动退役，已经转正的限制型不算在内
    - 账本的条数没有上限。不要因为一期的结果删假设；执行缺口对应的承诺已经不存在了，可以删
    - 新增只许写三类：执行缺口（我自己在计划、盯盘备注或等待行里写下要做却没照做的，或者主人指令里写了数字的硬线没做到的，必须落在具体的单子上；各笔单笔复盘正文里「有没有写下要做却没照做的」那一行写了有的，由你决定要不要立成执行缺口）、假设（本批单子里观察到的做法；假设不给 trader 看）、发现（主人指令里的边界或要求在花钱，给主人看）。主人指令里的规定不能当假设写进账本；上期的教训不许重抄，账本里已经有的不再新增
    - 新增的格子只有入场条件、风险限制、执行缺口三种：持仓途中怎么处理（失败怎么认、盈利怎么拿）不进账本；自己在计划里写了处理办法却没照做的，按执行缺口记
    - 跟具体单子挂不上的执行偏差（比如盯盘命中后漏了核查）不进账本，留在复盘正文的布防那一条里
    - 新增行末尾可以用「名下」（执行缺口用「守」「破」）列出它依据的本批单子，用素材里方括号中的仓位编号。想改一条旧条目的条件，就新增一条并写「来源 #编号」
    - 新增的正文是"条件 → 做法"，要写到没看过这些单子的人照着就能做，价位关系写成高于或低于哪条线；不超过 80 字。证据写具体单子和数字，不超过 60 字
    - 退役名单里的念头不要再提出来
    - 所有输出使用中文。素材与账本可能是另一门语言写的，照读照用，但本期输出一律用中文

    严格按下面两段输出，两个段标题都必须出现，【经验更新】之后只许出现表里规定的行：

    【本期复盘】
    战绩：<原样复述战绩表那一行>
    <单子类型>（<n> 笔，<w> 胜，净 <±x>）
    分界线：…
    （每个单子类型一段；本批没有单子就不写）
    机会：<一条>
    布防：<一条>

    【经验更新】
    新增 <单子类型代码或 通用> <入场条件|风险限制|执行缺口> <机会型|限制型|执行型> ｜ <条件 → 做法> ｜ <证据> ｜ 名下 <仓位编号> ｜ 来源 #<编号>
    发现 ｜ <正文，不超过 80 字> ｜ <证据，不超过 60 字>
    删除 #<编号> ｜ <理由>
    #<编号> <名下|守|破> <仓位编号> ｜ <依据，不超过 40 字>
    本期无更新
    每行用「｜」分隔，一行一条，不写别的字。仓位编号只写数字，几笔之间用顿号隔开。新增行末尾的「名下」（执行缺口是「守」「破」）和「来源」都可以不写。编号归类行只写素材里某笔下面列出的那几条，仓位编号只写那一笔的。单子类型代码用素材里出现的英文标签原文（如 PULLBACK、BREAKOUT）；删除只能删假设和执行缺口；没有任何要写的行时，只写一行「本期无更新」

  # 更新段标记。ExperienceOpParser 按【当前语言这一套】切：提示词刚让模型用哪套，交回另一套就是格式失守
  mark:
    updates: 【经验更新】

  # 经验更新表的行首固定词和标记词：解析器只认这一套（当前语言）
  op:
    # #编号那一行里的标记：名下、引用不符给假设和规律，守、破给执行缺口；本期一笔都没有写「无」
    under: 名下
    miscited: 引用不符
    kept: 守
    broken: 破
    none: 无
    add: 新增
    finding: 发现
    delete: 删除
    # 【经验更新】下没有要写的行时，单独写的那一行
    noUpdates: 本期无更新
    general: 通用
    source: 来源
    slot:
      entry: 入场条件
      failDef: 失败判定
      failHandle: 失败处理
      profitHandle: 盈利处理
      risk: 风险限制
      exec: 执行缺口
    dir:
      opportunity: 机会型
      restriction: 限制型
      execution: 执行型

  label:
    # ---- 用户消息骨架 ----
    # 窗口右端在 24 小时之前（ReviewRunner.WINDOW_LAG_MS）
    window: 复盘窗口（行情、盯盘布防、撤掉的限价单、战绩表的权益看这一段）：{{from}} → {{to}}；现在是 {{now}}
    windowStart: 本局开始
    # 主人亲笔，不翻译，可能是另一门语言
    ownerInstructions: 【主人的交易指令】（主人给的目标与边界；指令里已有的不写进账本）
    ownerInstructionsEmpty: （主人没写指令）
    closing: 现在写这一期的统一复盘：先按单子类型找分界线，再审机会和布防，最后填经验更新表。严格按两段固定格式输出。
    # 用户消息的最末一行，排在素材与账本之后——它们可能是另一门语言写的
    outputLanguage: 输出语言：中文。

    # ---- 战绩表 ----
    statsHeader: 【战绩表】（代码统计，只许原样复述，禁止自行计算）
    # 权益和回撤是复盘窗口内的
    statsEquity: 起始权益 {{start}} → 期末权益 {{end}}，期间收益率 {{pct}}%
    statsDrawdown: 期间最大回撤 {{dd}}%
    # 笔数胜负合计数的是本批单子
    statsClosed: 本批单子 {{n}} 笔：{{wins}} 胜 {{losses}} 负（胜率 {{winRate}}%），合计净盈亏 {{pnl}}（已计入手续费与资金费）
    noClosed: 本批没有单子

    # ---- 了结方式与持有时长 ----
    closeManner:
      liquidated: 强平
      stopLoss: 止损带走
      takeProfit: 止盈带走
      manual: 主动平仓
    duration:
      minutes: "{{n}}分钟"
      hours: "{{n}}小时"
      days: "{{n}}天"

    # ---- 案例素材 ----
    # 事实表的读法：统一复盘的单子块和单笔复盘的事实表块共用（CaseFileRenderer.guide）
    caseGuide: 目标写成「价位(平掉仓位的百分之几)」，分批止盈的有几档，没设止盈的写无。分档入场的单子多一行「入场安排」：每档的价位 × 数量，后面是成交或撤单的时刻与理由。路径行以仓位最终均价为参照，它的 R＝最终均价到计划止损的距离。成交那一根、平仓那一根 5m 里分不清先后：路径行的顺向在这两根只认确定在持仓期间出现过的价（成交那一根是收盘价，平仓那一根是开盘价和出场价，开平在同一根的只有出场价），逆向认整根；重放行的顺向在成交那一根也只认收盘价。路径行里「出场后」从平仓那一根的下一根算起；最有利价后面的括号是它比出场价往有利方向多走的价差，负数是这之后的 K 线里再没到过出场价。重放行问的是「下单后什么都不改会怎样」：各入场档按原价位等成交（实际成交过的用实际成交价），止损和止盈档按下单时的原样；1R＝首批各档全部成交、再全部按原止损了结的价差亏损，实际和重放都以它为单位，所以只成交了一部分的单子，实际的 R 会比较小。从首档成交后逐根 5m K线走到实际平仓后 24 小时（K 线还没到那一刻的走到最后一根，行里写着看得到多久），到那时还没全部了结的记未决；同一根里止损和止盈档都碰到按止损算；碰到一档止盈就了结那部分，剩下的接着走；仓位全部了结后，还没成交的入场档不再算成交。「到目标」是到过止盈档并且成交的部分全部了结（剩下的后来被止损的也算在盈亏里），没设止盈的单子只会是止损或未决；放宽止损的几档止盈不变、仓位按同样的风险金额缩小，括号里是折算后的盈亏。实际和重放都已扣手续费、都不含资金费；重放按止损价和目标价出场，不含滑点。标了「含加仓」的单子，实际一边包含加仓部分的盈亏，重放只看首批
    casesHeader: 【本批单子】（做完单笔复盘、还没进过统一复盘的单子，按单子类型分组。每笔前面方括号里是仓位编号，经验更新里用它；每笔先是代码算的事实表，「单笔复盘」后面写着它是平仓后多久做的，下面是正文；做完单笔复盘之后账本又新增了条目的，正文下面列着这几条。块的末尾列着窗口里持有过、但不在本批的仓位。{{guide}}）
    casesNone: 本批没有单子
    caseGroup: "{{play}}（{{n}} 笔，{{wins}} 胜，净 {{net}}）"
    caseGeneral: 未标类型
    # 一笔的事实表下面：这笔的单笔复盘正文，每行再缩进两格；after 是复盘开跑时离平仓多久
    caseDebrief: "  单笔复盘（平仓后 {{after}} 做的）："
    # 单笔复盘正文下面：那篇复盘开跑之后账本才新增的现役条目，由统一复盘给这一笔补归类
    caseGap: "  做这笔单笔复盘时还没有的条目：{{ids}}（由你给这一笔补归类）"
    caseTrade: "- [{{id}}] {{symbol}} {{side}} {{opened}} → {{closed}}（持有 {{held}}）｜ 入场 {{entry}} 止损 {{stop}} 目标 {{target}} 出场 {{exit}}，{{manner}} ｜ 净 {{pnl}}，资金费 {{funding}}"
    casePath: "  价格路径（以最终均价为参照）：最大浮盈 {{mfe}}（{{mfeAt}}，{{mfeR}}）｜ 最大逆向 {{mae}}（{{maeR}}）｜ 到 +0.5R / +1R 用时 {{tHalf}} / {{t1}} 分 ｜ 首次收回入场价 {{firstBack}} ｜ {{after}}"
    caseTargetsAfter: 到过原目标 {{hit}}/{{total}} 档
    caseNoTarget: 没设止盈
    # 路径行出场后那一段（CaseFileRenderer.afterExit）：满 24 小时、只看得到一段、出场后没有 K 线
    # 括号里是最有利价比出场价往有利方向多走的价差，负数是平仓那一根之后的 K 线里再没到过出场价
    caseAfterFull: 出场后 4h / 24h 最有利 {{best4}} / {{best}}（比出场价多走 {{gap4}} / {{gap}}），{{targets}}
    caseAfterPartial: 出场后只看得到 {{span}}：4h / {{span}} 内最有利 {{best4}} / {{best}}（比出场价多走 {{gap4}} / {{gap}}），{{targets}}
    caseAfterNone: 出场后没有 K 线
    # 重放行（CaseFileBuilder.Replay）：实际几 R、首档成交后最多 24 小时的方向、每档止损宽度的结局
    caseReplay: "  重放：实际 {{actual}} ｜ 首档成交后 {{span}} 内最大顺向 {{fav}}、最大逆向 {{adv}}，不设止损拿满 24h {{hold}} ｜ 止损{{widths}}{{walked}}"
    replayOriginal: "原样 {{outcome}}"
    replayWidth: "{{width}} 倍 {{outcome}}"
    replaySep: "、"
    replayTarget: 到目标（{{r}}）
    replayStop: 止损（{{r}}）
    replayOpen: 未决
    replayHoldShort: 未满 24h
    # 重放行顺向逆向那一段覆盖满 24 小时
    replaySpanFull: 24h
    # 平仓后的 K 线没满 24 小时、又有一档还没了结：各档只走到了哪
    replayWalked: （各档只走到平仓后 {{span}}）
    replayWalkedNone: （平仓后还没有 K 线，各档只走到平仓）
    # 本批全部单子的重放汇总，行由 PlayStatsAssembler.replayLines 出
    caseReplaySummary: 本批重放汇总：
    # 没绑过仓位就归档的计划
    cancelledHeader: 没成交就撤掉的限价档（撤单后 24 小时内的 5m K线）：
    cancelledRow: "- {{symbol}} {{side}} 限价 {{limit}} 止损 {{stop}} 目标 {{target}}，{{closed}} 结束：{{reason}} ｜ {{after}}"
    # 没穿过限价位的（正好碰到不算穿过）：这 24 小时里价格到过几档
    cancelledNotCrossed: "之后价格没穿过限价位，{{targetsAfter}}"
    # 穿过限价位的：从那一根起按原止损、原止盈档往后走，数的是了结之前到过几档
    cancelledCrossed: "之后价格 {{at}} 穿过限价位，从那一根起{{end}}，{{targetsAfter}}"
    cancelledStopped: 走到止损被打掉为止
    cancelledTargetsDone: 走到止盈档把仓位平完为止
    cancelledUndecided: 走到这段 K线末尾还没了结（止损没碰到）
    # 窗口里持有过、不在本批的仓位：窗口结束时还拿着的、窗口之后才平的、平了还没做完单笔复盘的。只说有这个仓，不给盈亏
    heldHeader: 窗口里持有过、不在本批的仓位（盈亏和细节留给它们自己那一篇复盘）：
    heldNone: （没有）
    heldRow: "- [{{id}}] {{symbol}} {{side}} {{play}} ｜ {{opened}} 开仓，{{entry}} ｜ {{state}}"
    # 行里的价：首批里最早成交那一档的；首批没有成交档的给仓位均价
    heldFirstFill: "首档成交价 {{price}}"
    heldAverage: "均价 {{price}}"
    heldOpen: 窗口结束时还拿着
    heldClosed: 窗口里已平仓，还没进本批
    caseHourly: "  1h 收盘：{{closes}}"
    casePlan: "  计划：论点 {{signals}} ｜ 失效 {{invalidation}} ｜ 修订 {{revisions}}"
    caseWithAdds: "（含加仓；实际包含加仓盈亏，重放只看首批）"
    caseEntries: "  入场安排：{{entries}} ｜ 计划合计 {{planned}}，实际成交 {{filled}}"
