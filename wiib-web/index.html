<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <!-- ===== 开屏（全宽墨线当进度，完成后沿线上下裂开）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #fafaf7 }
      html.dark { background: #0f1012 }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --bg: #fafaf7; --fg: #121316; --pri: #f25f0a;
      }
      html.dark #splash { --bg: #0f1012; --fg: #f1f1ec; --pri: #f97316 }
      #splash.out { pointer-events: none }

      /* 上下两块底色，接缝在 56% 处，那根线就画在接缝上 */
      .sp-top, .sp-bot { position: absolute; left: 0; right: 0; background: var(--bg) }
      .sp-top { top: 0; height: 56%; z-index: 1 }
      .sp-bot { top: calc(56% - 1px); bottom: 0 }

      /* logo 窗口下沿贴着线，logo 从线后面升上来（onload 才挂 .in，免得图没到过渡先播完） */
      .sp-mark { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); overflow: hidden; padding-bottom: 30px }
      .sp-mark img { display: block; width: min(220px, 46vw); height: auto; transform: translateY(calc(100% + 30px)) }
      .sp-mark img.in { transform: none; transition: transform .8s cubic-bezier(.16, 1, .3, 1) .15s }

      /* 全宽墨线=进度，线头带橙方块：先慢慢走到 86%，放行时补满 */
      .sp-rule { position: absolute; left: 0; right: 0; bottom: 0; height: 2px }
      .sp-rule i { position: absolute; inset: 0; background: var(--fg); transform: translateX(-100%) }
      .sp-rule i::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; background: var(--pri) }
      #splash.go .sp-rule i { transform: translateX(-14%); transition: transform 4.5s cubic-bezier(.12, .7, .2, 1) }
      #splash.done .sp-rule i { transform: none; transition: transform .32s cubic-bezier(.77, 0, .175, 1) }

      /* 退场：沿线上下裂开 */
      #splash.out .sp-top { transform: translateY(-100%); transition: transform .75s cubic-bezier(.77, 0, .175, 1) }
      #splash.out .sp-bot { transform: translateY(100%); transition: transform .75s cubic-bezier(.77, 0, .175, 1) }

      /* 减弱动效：logo 不升、退场不裂，直接淡出 */
      @media (prefers-reduced-motion: reduce) {
        .sp-mark img { transform: none }
        #splash.out { opacity: 0; transition: opacity .4s ease }
        #splash.out .sp-top, #splash.out .sp-bot { transform: none }
      }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0f1012' : '#fafaf7');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 开屏放在 #root 前：解析到就上屏，不等 bundle -->
    <div id="splash" aria-hidden="true">
      <div class="sp-top">
        <div class="sp-mark"><img src="/logo.png" alt="" fetchpriority="high" onload="this.classList.add('in')" /></div>
        <div class="sp-rule"><i></i></div>
      </div>
      <div class="sp-bot"></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        void el.offsetWidth;           // 先把线的起点落定，下一句挂 .go 才有过渡可播
        el.classList.add('go');

        // 放行协议：应用就绪喊 __wiibSplashDone → 线补满 → 沿线裂开 → 移除。
        // 至少亮 0.95s 等 logo 升完：缓存命中时应用秒就绪，不压一下就是一闪；
        // 最长 6s 强制放行：接口挂了也不能一直遮着页面
        var fired = false;
        function finish() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            el.classList.add('done');
            setTimeout(function () { el.classList.add('out'); }, 320);
            setTimeout(function () { el.remove(); }, 320 + 780);
          }, Math.max(0, 950 - performance.now()));
        }
        window.__wiibSplashDone = finish;
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
