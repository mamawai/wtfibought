<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* ===== 精密终端令牌（与 wiib-web/src/index.css 同源） ===== */
:root {
  --bg: #f6f6f4;
  --fg: #17181a;
  --card: #ffffff;
  --card-2: #fafaf8;
  --border: #e4e4df;
  --muted-fg: #71737b;
  --primary: #f97316;
  --primary-soft: rgba(249, 115, 22, .12);
  --gain: #089981;
  --loss: #f23645;
  --warning: #f59e0b;
  --edge: #d3d3cc;
  --grid: rgba(23, 24, 26, .035);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04);
  --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
html.dark {
  --bg: #0b0c0f;
  --fg: #eceef0;
  --card: #13151a;
  --card-2: #181b21;
  --border: #23262e;
  --muted-fg: #878b96;
  --primary: #f97316;
  --primary-soft: rgba(249, 115, 22, .16);
  --gain: #0abf95;
  --loss: #ff5a68;
  --warning: #f5a623;
  --edge: #2b2f38;
  --grid: rgba(236, 238, 240, .03);
  --shadow: none;
}
html { color-scheme: light; }
html.dark { color-scheme: dark; }

* { box-sizing: border-box; }
svg[data-icon] { width: 14px; height: 14px; flex: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(249, 115, 22, .25); }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.shell { max-width: 90rem; margin-inline: auto; padding: 28px 20px 60px; }

/* ===== 页头 ===== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.microlabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--muted-fg); text-transform: uppercase; }
.page-head h1 { margin: 6px 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.page-head .sub { margin: 0; max-width: 62ch; font-size: 13.5px; line-height: 1.6; color: var(--muted-fg); }
.head-controls { display: flex; gap: 8px; }
.ctl-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; min-width: 30px; padding: 0 9px;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px; cursor: pointer; box-shadow: var(--shadow);
}
.ctl-btn:hover { border-color: var(--primary); }
.ctl-btn svg { width: 14px; height: 14px; }

/* ===== 面板 ===== */
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 26px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.led { width: 6px; height: 6px; border-radius: 999px; background: var(--muted-fg); opacity: .4; flex: none; }
.led.run { background: var(--gain); opacity: 1; box-shadow: 0 0 6px var(--gain); }
.led.warn { background: var(--warning); opacity: 1; box-shadow: 0 0 6px var(--warning); }
.panel-title { font-size: 14.5px; font-weight: 700; }
.panel-title small { font-weight: 500; color: var(--muted-fg); margin-left: 8px; font-size: 12px; }
.panel-status { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; color: var(--muted-fg); }
.transport { display: flex; gap: 6px; }

/* 场景选择条：点谁跑谁，AUTO 恢复轮播 */
.scene-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
.scene-btn { font-family: var(--font-mono); font-size: 10px; letter-spacing: .03em; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--card-2); color: var(--muted-fg); cursor: pointer; transition: color .2s, border-color .2s; }
.scene-btn:hover { border-color: var(--primary); color: var(--fg); }
.scene-btn.live { color: var(--fg); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.scene-btn.act { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.scene-btn:disabled { opacity: .5; cursor: default; }

/* ===== 画布 ===== */
.canvas-wrap { overflow-x: auto; background: var(--card-2); position: relative; }
.canvas {
  position: relative; margin: 0 auto;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
}
.canvas svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wires path { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: stroke .3s; }
.wires path.on { stroke: var(--primary); filter: drop-shadow(0 0 3px rgba(249, 115, 22, .5)); }
.wires path.back { stroke-dasharray: 4 4; }
.wires path.answer { stroke-dasharray: 2 5; }
.wires circle.pulse { fill: var(--primary); filter: drop-shadow(0 0 4px rgba(249, 115, 22, .8)); }
.wires circle.pulse.dim { fill: var(--muted-fg); filter: none; }
.wires circle.pulse.bad { fill: var(--loss); filter: drop-shadow(0 0 4px rgba(242, 54, 69, .8)); }

/* ===== 节点 ===== */
.node {
  position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 7px;
  padding: 9px 11px; box-shadow: var(--shadow); cursor: pointer;
  opacity: .52; transition: opacity .35s, border-color .35s, box-shadow .35s;
  display: flex; flex-direction: column; gap: 5px; overflow: hidden;
}
.node:hover { opacity: .85; }
.node.on { opacity: 1; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary-soft), 0 2px 10px rgba(249, 115, 22, .12); }
.node.done { opacity: 1; border-color: var(--border); }
.node.err { border-color: var(--loss); box-shadow: 0 0 0 1px rgba(242, 54, 69, .2); }
.node.hold { opacity: 1; border-color: var(--warning); }
.node.hold .ndot { background: var(--warning); opacity: 1; box-shadow: 0 0 5px var(--warning); animation: blink 1s steps(2) infinite; }
.nhead { display: flex; align-items: center; gap: 6px; }
.nhead svg { width: 13px; height: 13px; color: var(--muted-fg); flex: none; }
.node.on .nhead svg { color: var(--primary); }
.ntag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; color: var(--muted-fg); }
.ndot { margin-left: auto; width: 5px; height: 5px; border-radius: 999px; background: var(--muted-fg); opacity: .35; flex: none; }
.node.on .ndot { background: var(--primary); opacity: 1; box-shadow: 0 0 5px var(--primary); animation: blink 1s steps(2) infinite; }
.node.done .ndot { background: var(--gain); opacity: 1; box-shadow: 0 0 4px var(--gain); animation: none; }
.node.err .ndot { background: var(--loss); opacity: 1; box-shadow: 0 0 5px var(--loss); animation: none; }
@keyframes blink { 50% { opacity: .35; } }
.ntitle { font-size: 12px; font-weight: 700; line-height: 1.25; }
.nsub { font-size: 10px; color: var(--muted-fg); line-height: 1.35; }
.nrows { display: flex; flex-direction: column; gap: 2px; }
.nrow { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-fg); line-height: 1.45; border-radius: 3px; padding: 0 3px; transition: background .25s, color .25s; }
.nrow .rled { width: 4px; height: 4px; border-radius: 999px; background: var(--muted-fg); opacity: .4; flex: none; transition: all .25s; }
.nrow.ok .rled { background: var(--gain); opacity: 1; box-shadow: 0 0 3px var(--gain); }
.nrow.hit { background: var(--primary-soft); color: var(--fg); }
.nrow.hit .rled { background: var(--primary); opacity: 1; }
.nrow.bad { background: rgba(242, 54, 69, .12); color: var(--loss); }
.nrow.bad .rled { background: var(--loss); opacity: 1; }
.nchips { display: flex; flex-wrap: wrap; gap: 3px; }
.nchip { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .02em; color: var(--muted-fg); border: 1px solid var(--border); border-radius: 4px; padding: 1.5px 5px; transition: all .25s; }
.nchip.hit { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.ncount { font-family: var(--font-mono); font-size: 10px; color: var(--muted-fg); display: flex; align-items: baseline; gap: 6px; }
.ncount b { font-size: 15px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.node.on .ncount b { color: var(--primary); }
.nstream { display: flex; flex-direction: column; gap: 3px; min-height: 46px; }
.nstream .sline { font-size: 10px; line-height: 1.5; color: var(--fg); border-left: 2px solid var(--primary); padding-left: 6px; min-height: 15px; }
.nstream .sline:empty { border-color: var(--border); }
.badge-pub { align-self: flex-start; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; padding: 1px 6px; }

/* HITL 卡片 */
.node.hitl-card { border-color: var(--warning); opacity: 0; pointer-events: none; transform: translateY(6px); transition: all .3s cubic-bezier(.16, 1, .3, 1); cursor: default; }
.node.hitl-card.show { opacity: 1; pointer-events: auto; transform: none; box-shadow: 0 0 0 1px rgba(245, 158, 11, .2), 0 4px 16px rgba(245, 158, 11, .15); }
.hitl-btns { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.hitl-btn { font-family: var(--font-mono); font-size: 10px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--card-2); text-align: center; }
.hitl-btn.ok { border-color: var(--primary); color: var(--primary); }
.hitl-btn.ok.pressed { background: var(--primary); color: #fff; }

/* ===== 日志条 ===== */
.trace { border-top: 1px solid var(--border); background: var(--card); padding: 8px 16px 10px; min-height: 118px; }
.trace-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.trace-lines { display: flex; flex-direction: column; gap: 2px; }
.tline { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.55; color: var(--fg); display: flex; gap: 8px; animation: tin .25s cubic-bezier(.16, 1, .3, 1); }
@keyframes tin { from { opacity: 0; transform: translateY(3px); } }
.tline .tt { color: var(--muted-fg); flex: none; font-variant-numeric: tabular-nums; }
.tline .tg { color: var(--primary); flex: none; width: 52px; letter-spacing: .05em; font-size: 9.5px; padding-top: 1px; }
.tline.dim { opacity: .45; }
.tline.bad { color: var(--loss); } .tline.bad .tg { color: var(--loss); }
.tline.good { color: var(--gain); } .tline.good .tg { color: var(--gain); }
.tline.warn { color: var(--warning); } .tline.warn .tg { color: var(--warning); }

/* 面板脚注 */
.panel-foot { display: flex; gap: 18px; flex-wrap: wrap; padding: 9px 16px; border-top: 1px solid var(--border); background: var(--card-2); }
.panel-foot span { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-fg); letter-spacing: .02em; }

/* 节点详情浮层 */
.pop { position: absolute; z-index: 30; width: 250px; background: var(--card); border: 1px solid var(--primary); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); animation: tin .18s cubic-bezier(.16, 1, .3, 1); }
.pop .pt { font-size: 12px; font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pop .px { cursor: pointer; border: none; background: none; padding: 2px; color: var(--muted-fg); display: inline-flex; }
.pop .px svg { width: 12px; height: 12px; }
.pop .pd { font-size: 11px; line-height: 1.65; color: var(--muted-fg); }

.foot-note { margin-top: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--muted-fg); letter-spacing: .04em; }

@media (max-width: 700px) {
  .page-head h1 { font-size: 21px; }
  .panel-status { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .node, .wires path, .nrow, .nchip { transition: none; }
  .node.on .ndot { animation: none; }
  .tline { animation: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="page-head">
    <div>
      <div class="microlabel">WHATIFIBOUGHT &middot; AGENT HARNESS</div>
      <h1 data-k="title"></h1>
      <p class="sub" data-k="subtitle"></p>
    </div>
    <div class="head-controls">
      <button class="ctl-btn" id="btn-lang"></button>
      <button class="ctl-btn" id="btn-theme"><svg data-icon="sun"></svg></button>
    </div>
  </header>
  <div id="panels"></div>
  <div class="foot-note" data-k="footnote"></div>
</div>
<noscript><p style="padding:20px;font-size:13px">This page needs JavaScript to animate the flows.</p></noscript>

<script>
'use strict';
/* ============ 基础 ============ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { } }
};
let LANG = store.get('wiib-flow-lang') || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en');
if (LANG !== 'zh' && LANG !== 'en') LANG = 'zh';
const T = o => typeof o === 'string' ? o : (o[LANG] ?? o.zh);

const UI = {
  title: { zh: 'Agent 工作流，跑给你看', en: 'The agent harness, running in the open' },
  subtitle: {
    zh: 'trader 的一次唤醒、chat 的一轮对话——按真实时序动起来的信号路径。脉冲是数据在走，LED 是闸门在过，点任意节点看它是什么。',
    en: 'One trader wakeup, one chat turn — the real signal paths animated on their real timing. Pulses are data moving, LEDs are gates passing. Click any node to see what it is.'
  },
  footnote: {
    zh: 'SOURCE wiib-quant/agent · 同源文档 docs/agent-harness/architecture.md · 所有数据均为模拟',
    en: 'SOURCE wiib-quant/agent · companion doc docs/agent-harness/architecture.md · all data simulated'
  },
  trace: 'TRACE',
  st: { idle: { zh: 'IDLE · 待机', en: 'IDLE' }, run: { zh: 'RUN · 运行中', en: 'RUNNING' }, sleep: { zh: 'SLEEP · 休眠', en: 'SLEEPING' }, hitl: { zh: 'HITL · 等用户确认', en: 'HITL · AWAITING USER' }, paused: { zh: 'PAUSED · 已暂停', en: 'PAUSED' }, yield: { zh: 'YIELD · 已让位', en: 'YIELDED' } },
  play: { zh: '播放', en: 'Play' }, pause: { zh: '暂停', en: 'Pause' }, restart: { zh: '重放', en: 'Replay' },
  auto: { zh: '轮播', en: 'AUTO' },
  reduced: { zh: '系统开了「减少动态效果」，展示静态全图。', en: 'Reduced motion is on — showing the static diagram.' }
};

/* ============ 面板配置（label 全部中英双写） ============ */
const PANELS = [
  {
    id: 'trader',
    num: 'HARNESS 01',
    title: { zh: 'trader agent', en: 'trader agent' },
    sub: { zh: '唯一会动真账本的 · 配套每日复盘', en: 'touches the real ledger · with daily review' },
    w: 1180, h: 644,
    nodes: [
      { id: 'clock', x: 16, y: 48, w: 170, h: 88, tag: 'CLOCK', icon: 'clock',
        title: { zh: 'K 线收盘事件', en: 'Candle close' },
        sub: { zh: '例行 · 对齐 interval 边界', en: 'routine · interval-aligned' },
        detail: { zh: 'TraderScheduler 以 5m K 线收盘事件为唯一时钟，对齐到各 trader 选定的 interval（5m/15m/1h/4h）边界；同一边界多币多次触发按边界去重。丢失的 K 线不补跑——陈旧信号没有意义。', en: 'TraderScheduler uses 5m candle-close events as its sole clock, aligned to each trader’s chosen interval boundary. Duplicate fires on one boundary are deduped. Lost candles are never replayed — stale signals are worthless.' } },
      { id: 'sentinel', x: 16, y: 150, w: 170, h: 104, tag: 'SENTRY', icon: 'activity',
        title: { zh: '波动哨兵', en: 'Volatility sentinel' },
        rows: [
          { id: 'amp', t: { zh: '5min 振幅 > 阈值×灵敏度', en: 'range > thresh × sens' } },
          { id: 'hold', t: { zh: '持仓/挂单才惊动 · 冷静期', en: 'holders only · cooldown' } }
        ],
        detail: { zh: '盯 markPrice tick（约 1s 一跳）的 5 分钟滚动振幅，超过「币基准阈值 × trader 灵敏度」且该 trader（1h/4h 档）持有该币仓位或挂单才触发警报唤醒；另有冷静期与预算预检。空仓者不惊动，它是例行唤醒的补充而非替代。', en: 'Watches the 5-minute rolling range of markPrice ticks. Fires an alert wakeup only when range exceeds the per-symbol threshold × trader sensitivity AND that (1h/4h) trader holds a position or order in the symbol; cooldown and budget prechecks apply. Flat traders are never disturbed.' } },
      { id: 'manual', x: 16, y: 270, w: 170, h: 76, tag: 'MANUAL', icon: 'mouse-pointer-click',

        rows: [

          { id: 'c3', t: { zh: '最近决策+论点战绩', en: 'recent decisions+thesis stats' } },
          { id: 'c4', t: { zh: '复盘笔记', en: 'review notes' } },
          { id: 'c6', t: { zh: '财经日历', en: 'econ calendar' } },
          { id: 'c7', t: { zh: '主人留言', en: 'owner note' } }
        ],
        detail: { zh: '每次唤醒现读现拼，零热更新机制——用户改完自定义提示词，下一根 K 线自然生效。', en: 'Reassembled fresh on every wakeup — edit your custom prompt and the next candle simply picks it up.' } },
      { id: 'agent', x: 664, y: 110, w: 180, h: 104, tag: 'REACT', icon: 'cpu',

        counter: { label: { zh: '模型调用', en: 'model calls' }, max: 8 },

/* ============ 渲染 ============ */
const R = 9; // 导线拐角半径
function orthPath(pts) {
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x, y] = pts[i], [px, py] = pts[i - 1], [nx, ny] = pts[i + 1];
    const r = Math.min(R, Math.hypot(x - px, y - py) / 2, Math.hypot(nx - x, ny - y) / 2);
    const ax = x - Math.sign(x - px) * r, ay = y - Math.sign(y - py) * r;
    const bx = x + Math.sign(nx - x) * r, by = y + Math.sign(ny - y) * r;
    d += ` L ${ax} ${ay} Q ${x} ${y} ${bx} ${by}`;
  }
  const l = pts[pts.length - 1];
  return d + ` L ${l[0]} ${l[1]}`;
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const paths = {};
  for (const eg of cfg.edges) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', orthPath(eg.pts));
    if (eg.cls) p.classList.add(eg.cls);
    svg.appendChild(p);
    paths[eg.id] = p;
  }
  canvas.appendChild(svg);

  const nodes = {};
  for (const n of cfg.nodes) {
    const d = el('div', 'node' + (n.hitl ? ' hitl-card' : ''));
    d.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    let inner = `<div class="nhead"><svg data-icon="${n.icon}"></svg><span class="ntag">${n.tag}</span><span class="ndot"></span></div>`;
    inner += `<div class="ntitle">${esc(T(n.title))}</div>`;
    if (n.sub) inner += `<div class="nsub">${esc(T(n.sub))}</div>`;
    if (n.counter) inner += `<div class="ncount"><b data-c>0</b><span>/ ${n.counter.max} · ${esc(T(n.counter.label))}</span></div>`;
    if (n.rows) inner += `<div class="nrows">${n.rows.map(r => `<div class="nrow" data-row="${r.id}">${r.led ? '<span class="rled"></span>' : '<span class="rled" style="opacity:.15"></span>'}<span>${esc(T(r.t))}</span></div>`).join('')}</div>`;
    if (n.chips) inner += `<div class="nchips">${n.chips.map(c => `<span class="nchip" data-chip="${c.id}">${esc(T(c.t))}</span>`).join('')}</div>`;
    if (n.stream) inner += `<div class="nstream">${'<div class="sline"></div>'.repeat(n.stream)}</div>`;
    if (n.badge) inner += `<span class="badge-pub">${esc(T(n.badge))}</span>`;
    if (n.btns) inner += `<div class="hitl-btns"><button class="hitl-btn ok">${esc(T(n.btns.ok))}</button><button class="hitl-btn">${esc(T(n.btns.no))}</button></div>`;
    d.innerHTML = inner;
    if (!n.hitl) d.addEventListener('click', ev => { ev.stopPropagation(); showPop(canvas, n); });
    canvas.appendChild(d);
    nodes[n.id] = d;
  }
  wrap.appendChild(canvas);

  const trace = el('div', 'trace');
  trace.innerHTML = `<div class="trace-head"><span class="microlabel">${UI.trace}</span><span class="led run" style="width:5px;height:5px"></span></div>`;
  const tlines = el('div', 'trace-lines');
  trace.appendChild(tlines);

  const foot = el('div', 'panel-foot');
  foot.innerHTML = cfg.foot.map(f => `<span>${esc(T(f))}</span>`).join('');

  panel.append(head, wrap, trace, foot);
  document.getElementById('panels').appendChild(panel);
  return { cfg, panel, led, status, bPlay, bRe, bSpd, svg, paths, nodes, tlines, canvas };
}

/* 节点详情浮层 */
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function showPop(canvas, n) {
  closePop();
  const pop = el('div', 'pop');
  pop.innerHTML = `<div class="pt">${esc(T(n.title))}<button class="px" aria-label="close"><svg data-icon="x"></svg></button></div><div class="pd">${esc(T(n.detail || n.sub || ''))}</div>`;
  const cw = canvas.clientWidth;
  let left = n.x + n.w + 12;
  if (left + 250 > cw) left = Math.max(8, n.x - 262);
  pop.style.left = left + 'px';
  pop.style.top = Math.min(n.y, canvas.clientHeight - 150) + 'px';
  pop.addEventListener('click', ev => ev.stopPropagation());
  pop.querySelector('.px').addEventListener('click', closePop);
  canvas.appendChild(pop);
  popEl = pop;
  icons(pop);
}
document.addEventListener('click', closePop);

/* ============ 动画引擎 ============ */
class Abort extends Error { }
class Runner {
  constructor(view, script, scenes) {
    this.v = view; this.script = script; this.scenes = scenes;
    this.pinned = null;   // 钉住的场景序号，null=轮播
    this.speed = 1; this.paused = false; this.runId = 0; this.userPaused = false;
    this.clock = 8 * 3600 * 1000; // 08:00:00 起步的假钟
  }
  chk(id) { if (id !== this.runId) throw new Abort(); }
  async sleep(ms) {
    const id = this.runId, end = performance.now() + ms / this.speed;
    while (performance.now() < end || this.paused) {
      this.chk(id);
      await new Promise(r => setTimeout(r, 40));
      if (this.paused) continue;
    }
    this.chk(id);
  }
  node(nid) { return this.v.nodes[nid]; }
  on(nid) { this.node(nid).classList.add('on'); this.node(nid).classList.remove('done', 'err'); }
  done(nid) { this.node(nid).classList.remove('on', 'err'); this.node(nid).classList.add('done'); }
  err(nid) { this.node(nid).classList.add('err'); }
  clearErr(nid) { this.node(nid).classList.remove('err'); }
  row(nid, rid, cls = 'hit', keep = false) {
    const r = this.node(nid).querySelector(`[data-row="${rid}"]`);
    if (!r) return;
    r.classList.add(cls);
    if (!keep) setTimeout(() => r.classList.remove(cls), 1100 / this.speed);
  }
  ledOk(nid, rid) { const r = this.node(nid).querySelector(`[data-row="${rid}"]`); if (r) r.classList.add('ok'); }
  chip(nid, cid) { const c = this.node(nid).querySelector(`[data-chip="${cid}"]`); if (c) c.classList.add('hit'); }
  count(nid, val) { const b = this.node(nid).querySelector('[data-c]'); if (b) b.textContent = val; }
  hold(nid) { this.node(nid).classList.remove('on'); this.node(nid).classList.add('hold'); }
  unhold(nid) { this.node(nid).classList.remove('hold'); }
  scene(m) { this.sceneText = T(m); this.status(this._st || 'run'); }
  status(k) { this._st = k; this.v.status.textContent = (this.sceneText ? this.sceneText + '   ' : '') + T(UI.st[k]); }
  log(tag, msg, cls) {
    this.clock += 300 + Math.random() * 1500; // 假钟随手走
    const d = new Date(this.clock);
    const tt = `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}:${String(d.getUTCSeconds()).padStart(2, '0')}`;
    const line = el('div', 'tline' + (cls ? ' ' + cls : ''));
    line.innerHTML = `<span class="tt">${tt}</span><span class="tg">${tag}</span><span>${esc(T(msg))}</span>`;
    this.v.tlines.appendChild(line);
    const kids = this.v.tlines.children;
    while (kids.length > 6) kids[0].remove();
    for (let i = 0; i < kids.length - 4; i++) kids[i].classList.add('dim');
  }
  pulse(eid, opts = {}) {
    const path = this.v.paths[eid];
    const id = this.runId;
    path.classList.add('on');
    const len = path.getTotalLength();
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', opts.r || 3.5);
    c.setAttribute('class', 'pulse' + (opts.cls ? ' ' + opts.cls : ''));
    this.v.svg.appendChild(c);
    const dur = (opts.dur || 650) / this.speed;
    return new Promise(res => {
      let t0 = null, elapsed = 0, last = null;
      const step = ts => {
        if (id !== this.runId) { c.remove(); path.classList.remove('on'); return res(); }
        if (this.paused) { last = null; return requestAnimationFrame(step); }
        if (last == null) last = ts;
        elapsed += ts - last; last = ts;
        const k = Math.min(elapsed / dur, 1);
        const p = path.getPointAtLength((opts.reverse ? 1 - k : k) * len);
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
        if (k < 1) requestAnimationFrame(step);
        else { c.remove(); if (!opts.hold) setTimeout(() => { if (id === this.runId) path.classList.remove('on'); }, 350); res(); }
      };
      requestAnimationFrame(step);
    });
  }
  async type(nid, idx, msg) {
    const lines = this.node(nid).querySelectorAll('.sline');
    const target = lines[idx]; if (!target) return;
    const text = T(msg);
    for (let i = 1; i <= text.length; i++) {
      target.textContent = text.slice(0, i);
      await this.sleep(26);
    }
  }
  clearStream(nid) { this.node(nid).querySelectorAll('.sline').forEach(s => s.textContent = ''); }
  hitl(showing) { this.node('hitl').classList.toggle('show', showing); }
  hitlPress() {
    const b = this.node('hitl').querySelector('.hitl-btn.ok');
    if (b) { b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 900 / this.speed); }
  }
  reset() {
    const v = this.v;
    Object.values(v.nodes).forEach(n => n.classList.remove('on', 'done', 'err', 'hold', 'show'));
    v.panel.querySelectorAll('.nrow').forEach(r => r.classList.remove('hit', 'ok', 'bad'));
    v.panel.querySelectorAll('.nchip').forEach(c => c.classList.remove('hit'));
    v.panel.querySelectorAll('[data-c]').forEach(b => b.textContent = '0');
    v.panel.querySelectorAll('.sline').forEach(s => s.textContent = '');
    Object.values(v.paths).forEach(p => p.classList.remove('on'));
    v.svg.querySelectorAll('circle').forEach(c => c.remove());
  }
  async run() {
    const id = ++this.runId;
    this.reset();
    let cycle = 0;
    try {
      while (true) {
        this.chk(id);
        const scene = this.pinned ?? (cycle++ % this.scenes.length);
        if (this.onScene) this.onScene(scene);
        this.v.led.classList.add('run');
        this.status('run');
        await this.script(this, scene);
        this.status('sleep');
        this.v.led.classList.remove('run');
        await this.sleep(2600);
        this.reset();
      }
    } catch (e) { if (!(e instanceof Abort)) throw e; }
  }
  stop() { this.runId++; this.v.led.classList.remove('run'); }
}

/* ============ 剧本：trader 四个场景轮播 ============ */
const TR_SCENES = [
  { zh: 'A · 例行唤醒 → 开仓', en: 'A · routine wake → open' },
  { zh: 'B · 警报唤醒 → 失效退出', en: 'B · alert wake → invalidation exit' },
  { zh: 'C · 例行唤醒 → 观望', en: 'C · routine wake → wait' },
  { zh: 'D · 日线交接 → 复盘', en: 'D · daily handover → review' }
];

/* 共用前半段：触发 → 准入 → 组装 → 进循环 */
async function trEnter(c, alert) {
  if (alert) {
    c.on('sentinel');
    c.row('sentinel', 'amp', 'hit'); c.row('sentinel', 'hold', 'hit');
    c.log('SENTRY', { zh: '5min 振幅 2.4% 超阈值 · 持有 ETH → 警报唤醒', en: '5min range 2.4% over threshold · holds ETH → alert wakeup' }, 'warn');
    await c.sleep(700);
    await c.pulse('sn-sch');
  } else {
    c.on('clock');
    c.log('CLOCK', { zh: '1h 边界到达 · 例行唤醒', en: '1h boundary hit · routine wakeup' });
    await c.sleep(600);
    await c.pulse('ck-sch');
  }
  c.on('sched');
  for (const r of ['mutex', 'gate', 'window', 'budget']) { c.ledOk('sched', r); await c.sleep(280); }
  c.log('SCHED', { zh: '互斥 ✓ 并发闸 3/10 ✓ 时段 ✓ · 预算 600s', en: 'mutex ✓ gate 3/10 ✓ window ✓ · budget 600s' });
  await c.sleep(400);
  c.done(alert ? 'sentinel' : 'clock');
  await c.pulse('sch-asm');
  c.done('sched'); c.on('asm');
  for (const ch of ['c1', 'c2', 'c3', 'c4', 'c6', 'c7']) { c.chip('asm', ch); await c.sleep(140); }
  c.log('PROMPT', { zh: '现读现拼：账户状态 + 复盘笔记 + 财经日历', en: 'assembled fresh: account + review notes + econ calendar' });
  await c.sleep(500);
  await c.pulse('asm-ag');
  c.done('asm'); c.on('agent');
  c.count('agent', 1);
}

/* 数据工具一来一回 */
async function trData(c, rowId, n, msg) {
  await c.pulse('ag-data'); c.on('data');
  c.row('data', rowId); c.count('agent', n);
  c.log('TOOL', msg);
  await c.pulse('ag-data', { reverse: true, cls: 'dim' });
  await c.sleep(300);
}

async function traderScript(c, scene) {
  c.scene(TR_SCENES[scene]);

  if (scene === 3) {
    // 日线交接：交易定格 → 全体复盘 → 笔记注入下一唤醒
    c.on('clock');
    c.log('CLOCK', { zh: '日线边界（UTC0 / 北京 08:00）', en: 'daily boundary (UTC0 / 08:00 Beijing)' });
    await c.sleep(600);
    await c.pulse('ck-sch');
    c.on('sched');
    c.log('SCHED', { zh: '停工窗口开始 · 四个唤醒入口全拒，K 线事件直接丢弃', en: 'blackout begins · all four wake entries rejected, candle events dropped' }, 'warn');
    await c.sleep(1000);
    c.on('dec');
    c.log('DB', { zh: '素材 = 已定格的一天：决策行 + 已归档计划', en: 'materials = the frozen day: decision rows + archived plans' });
    await c.sleep(600);
    await c.pulse('dec-rev', { dur: 900 });
    c.done('dec'); c.on('rev');
    c.row('rev', 'r1', 'hit');
    c.log('REVIEW', { zh: '四块硬事实代码算好 · 战绩只许复述禁止自算', en: 'hard facts precomputed · stats quoted, never self-graded' });
    await c.sleep(900);
    c.row('rev', 'r2', 'hit');
    c.log('REVIEW', { zh: '单次调用无工具 · 【本期复盘】+【记忆更新】', en: 'one call, no tools · review section + memory update' });
    await c.sleep(900);
    c.row('rev', 'r3', 'hit', true);
    c.log('REVIEW', { zh: '复盘笔记覆盖 memory · REVIEW 决策行公开', en: 'note overwrites memory · REVIEW row goes public' }, 'good');
    await c.sleep(700);
    c.log('SCHED', { zh: '等所有 trader 的复盘写完', en: 'wait for every trader’s review' }, 'warn');
    await c.sleep(1100);
    await c.pulse('notes-asm', { dur: 1100 });
    c.done('rev'); c.on('asm');
    c.chip('asm', 'c4');
    c.log('SCHED', { zh: '窗口结束 · 下一根 K 线带着新笔记醒来', en: 'blackout over · next candle wakes with a fresh note' }, 'good');
    await c.sleep(1300);
    c.done('asm'); c.done('sched'); c.done('clock');
    return;
  }

  await trEnter(c, scene === 1);

  if (scene === 0) {
    c.log('REACT', { zh: '模型调用 1/8 · 先检验上一轮的承诺', en: 'model call 1/8 · re-check last round’s commitments' });
    await c.sleep(900);
    await trData(c, 'klines', 2, { zh: 'klines ETHUSDT 1h ×200', en: 'klines ETHUSDT 1h ×200' });
    await trData(c, 'snap', 3, { zh: 'market_snapshot · 资金费偏离 −0.018%', en: 'market_snapshot · funding deviation −0.018%' });
    await trData(c, 'fund', 4, { zh: 'funding_history · 连续 3 期为负', en: 'funding_history · negative 3 periods straight' });
    c.done('data');
    await c.sleep(500);

    // 开仓：先被拒再修正
    c.count('agent', 5);
    await c.pulse('ag-guard'); c.on('guard');
    await c.sleep(400);
    c.err('guard'); c.row('guard', 'veto', 'bad');
    c.log('GUARD', { zh: '拒绝：杠杆 25x 超出主人区间 3–10x', en: 'rejected: 25x outside owner range 3–10x' }, 'bad');
    await c.pulse('ag-guard', { reverse: true, cls: 'bad' });
    await c.sleep(800);
    c.clearErr('guard');
    c.count('agent', 6);
    await c.pulse('ag-guard');
    c.row('guard', 'spec', 'hit');
    c.log('GUARD', { zh: '修正重试 8x · 校验通过', en: 'corrected to 8x · passed' }, 'good');
    c.done('guard');
    await c.pulse('guard-trade'); c.on('trade');
    c.row('trade', 'open');
    await c.pulse('trade-sim'); c.on('sim');
    c.log('SIM', { zh: 'open_position ETHUSDT 空 8x · 成交', en: 'open_position ETHUSDT short 8x · filled' });
    await c.pulse('trade-sim', { reverse: true, cls: 'dim' });
    c.done('sim');
    await c.sleep(500);
    c.row('trade', 'plan'); c.count('agent', 7);
    c.log('TOOL', { zh: 'write_plan：论点 / 数据引用 / 失效条件 → ai_trader_plan', en: 'write_plan: thesis / citations / invalidation → ai_trader_plan' });
    await c.sleep(700);
    c.row('trade', 'sl'); c.count('agent', 8);
    c.log('TOOL', { zh: 'set_stop_loss +2.1% · 挂好', en: 'set_stop_loss +2.1% · placed' });
    c.done('trade');
    await c.sleep(700);
    await c.pulse('ag-dec', { dur: 800 });
    c.done('agent'); c.on('dec');
    c.row('dec', 'full', 'hit', true); c.row('dec', 'plan2', 'hit', true);
    c.log('DB', { zh: '决策全文 + 动作轨迹 + 权益 → ai_trader_decision · 公开', en: 'full reasoning + actions + equity → ai_trader_decision · public' }, 'good');
    await c.sleep(1100);
    c.done('dec');
    c.log('SCHED', { zh: '休眠 · 等下一根 K 线', en: 'sleeping until the next candle' }, 'dim');

  } else if (scene === 1) {
    c.log('REACT', { zh: '模型调用 1/8 · 优先检验在场计划的失效条件', en: 'call 1/8 · check live plan invalidation first' });
    await c.sleep(800);
    await trData(c, 'klines', 2, { zh: 'klines ETHUSDT 1h · 收盘 3097', en: 'klines ETHUSDT 1h · close 3097' });
    c.count('agent', 3);
    c.log('REACT', { zh: '失效条件触发：1h 收盘跌破 3120', en: 'invalidation hit: 1h close below 3120' }, 'warn');
    await c.sleep(700);
    await c.pulse('ag-guard');   // 平仓不过 TradeGuard，它只卡开仓
    await c.pulse('guard-trade');
    c.on('trade'); c.row('trade', 'close');
    await c.pulse('trade-sim'); c.on('sim');
    c.log('SIM', { zh: 'close_position ETHUSDT · 全平 · 已实现 −0.6%', en: 'close_position ETHUSDT · flat · realized −0.6%' });
    await c.pulse('trade-sim', { reverse: true, cls: 'dim' });
    c.done('sim');
    await c.sleep(400);
    c.row('trade', 'cancel'); c.count('agent', 4);
    c.log('TOOL', { zh: 'cancel_order · 撤掉挂着的止损/止盈', en: 'cancel_order · pull the resting SL/TP' });
    c.done('trade'); c.done('data');
    await c.sleep(600);
    await c.pulse('ag-dec', { dur: 800 });
    c.done('agent'); c.on('dec');
    c.row('dec', 'full', 'hit', true); c.row('dec', 'plan2', 'hit', true);
    c.log('DB', { zh: '退出三条路之一：失效条件 → 决策行公开 · 计划归档给 reviewer', en: 'one of three exits: invalidation → decision public · plan archived for the reviewer' }, 'good');
    await c.sleep(1100);
    c.done('dec');

  } else {
    // 观望：多数唤醒的真实形态
    c.log('REACT', { zh: '模型调用 1/8 · 单问题框架：计划需要改变吗？', en: 'call 1/8 · single question: does the plan need to change?' });
    await c.sleep(800);
    await trData(c, 'klines', 2, { zh: 'klines ETHUSDT 1h ×200', en: 'klines ETHUSDT 1h ×200' });
    await trData(c, 'ind', 3, { zh: 'indicators · ATR 收缩，无新信号', en: 'indicators · ATR contracting, no new signal' });
    c.done('data');
    c.log('REACT', { zh: '未触失效 · 未到止盈 · 资金费无异动 → 计划不变', en: 'no invalidation · target not hit · funding quiet → plan stands' });
    await c.sleep(900);
    await c.pulse('ag-dec', { dur: 800 });
    c.done('agent'); c.on('dec');
    c.row('dec', 'full', 'hit', true);
    c.log('DB', { zh: 'WAIT · 不动手也是决策，全文照样公开', en: 'WAIT · doing nothing is still a decision, published in full' }, 'good');
    await c.sleep(1100);
    c.done('dec');
    c.log('SCHED', { zh: '多数唤醒长这样：检验 → 观望', en: 'most wakeups look like this: verify → wait' }, 'dim');
  }
}

/* ============ 剧本：chat 三个场景轮播 ============ */
const CH_SCENES = [
  { zh: 'A · 完整一轮：路由 → 专家 → HITL → 汇总', en: 'A · full turn: route → experts → HITL → answer' },
  { zh: 'B · 让位 → 补答轮', en: 'B · yield → follow-up turn' },
  { zh: 'C · 新闻双源：BlockBeats + 联网搜索', en: 'C · dual-source news: BlockBeats + web search' }
];

/* 共用开场：提问 → 四道准入 → SSE → 路由亮起 */
async function chGates(c, qMsg, fast) {
  c.on('user');
  c.log('USER', qMsg);
  await c.sleep(fast ? 400 : 600);
  await c.pulse('u-g');
  c.on('gates');
  for (const g of ['g1', 'g2', 'g3', 'g4']) { c.ledOk('gates', g); await c.sleep(fast ? 180 : 320); }
  c.log('GATE', { zh: '端点 ✓ 叶子缓存命中 ✓ 用户闸 ✓ 全局 3/10 ✓ → SSE 建流', en: 'endpoint ✓ leaf cache hit ✓ user gate ✓ global 3/10 ✓ → SSE opened' });
  await c.sleep(400);
  c.done('gates'); c.done('user');
  await c.pulse('g-r');
  c.on('router');
}

/* 共用收尾：终态覆盖写 */
async function chStore(c, msg) {
  await c.pulse('s-h');
  c.done('sum'); c.on('hist');
  c.row('hist', 'ow', 'hit', true);
  c.log('DB', msg, 'good');
  await c.sleep(1000);
  c.done('hist');
}

async function chatScript(c, scene) {
  c.scene(CH_SCENES[scene]);

  if (scene === 0) {
    await chGates(c, { zh: '「ETH 永续现在适合做空吗？」', en: '“Is ETH perp a short right now?”' });

    // 第 1 轮：market + news 并行
    c.count('router', 1);
    c.log('ROUTE', { zh: 'tool_call → [market_agent, news_agent] · 轮次 1/3', en: 'tool_call → [market_agent, news_agent] · round 1/3' });
    c.chip('router', 'dm'); c.chip('router', 'dn');
    await c.sleep(500);
    await Promise.all([
      (async () => {
        await c.pulse('r-m'); c.on('xm');
        c.row('xm', 'snap'); await c.sleep(500);
        c.row('xm', 'fund'); await c.sleep(500);
        c.row('xm', 'depth');
        c.log('EXPERT', { zh: 'market_agent：snapshot + funding + 盘口（虚拟线程）', en: 'market_agent: snapshot + funding + depth (virtual thread)' });
        await c.sleep(400);
        await c.pulse('m-r', { cls: 'dim', dur: 750 }); c.done('xm');
      })(),
      (async () => {
        await c.pulse('r-n'); c.on('xn');
        c.row('xn', 'pre');
        c.log('EXPERT', { zh: 'news_agent：BlockBeats 预取 12 条', en: 'news_agent: 12 BlockBeats items prefetched' });
        await c.sleep(900);
        await c.pulse('n-r', { cls: 'dim', dur: 600 }); c.done('xn');
      })()
    ]);
    c.log('ROUTE', { zh: '结论按派发顺序并入 working', en: 'conclusions merged into working, dispatch order' });
    await c.sleep(600);

    // 第 2 轮：trader_agent
    c.count('router', 2); c.chip('router', 'dt');
    c.log('ROUTE', { zh: 'tool_call → [trader_agent] · 轮次 2/3', en: 'tool_call → [trader_agent] · round 2/3' });
    await c.pulse('r-t'); c.on('xt');
    c.row('xt', 'pos'); await c.sleep(450);
    c.row('xt', 'pl');
    c.log('EXPERT', { zh: 'trader_agent：持仓 / 计划 / 最近决策（只读）', en: 'trader_agent: positions / plans / recent decisions (read-only)' });
    await c.sleep(450);
    await c.pulse('t-r', { cls: 'dim', dur: 750 }); c.done('xt');
    await c.sleep(500);

    // FINISH → 汇总
    c.count('router', 3);
    c.log('ROUTE', { zh: '→ FINISH · 转汇总', en: '→ FINISH · hand off to summarizer' });
    await c.sleep(400);
    await c.pulse('r-s', { dur: 1000 });
    c.done('router'); c.on('sum');
    c.log('SUM', { zh: 'summarizer 深模型 · 流式作答', en: 'summarizer, deep model · streaming' });
    await c.type('sum', 0, { zh: '资金费连续 3 期为负，空头已拥挤；', en: 'Funding negative 3 straight periods;' });

    // HITL：深研判要用户点头
    c.chip('sum', 'sda');
    c.status('hitl');
    c.hitl(true);
    c.log('HITL', { zh: 'run_deep_analysis 需确认 · 键 = 会话+工具+标的', en: 'run_deep_analysis needs approval · key = session+tool+symbol' }, 'warn');
    await c.sleep(1800);
    c.hitlPress();
    await c.sleep(600);
    c.hitl(false);
    c.status('run');
    c.log('HITL', { zh: '用户已确认 · 深研判执行（3 次深模型调用）', en: 'approved · deep analysis runs (3 deep calls)' }, 'good');
    await c.sleep(900);

    await c.type('sum', 1, { zh: '盘口 25bp 内买盘压卖盘 3.2×，急跌有接；', en: 'Bids 3.2× asks within 25bp;' });
    c.pulse('s-u', { dur: 1400, cls: 'dim', r: 2.5 });
    await c.type('sum', 2, { zh: '结论：不追空，等 4H 供给区再评估。', en: 'Don’t chase; reassess at 4H supply.' });
    c.pulse('s-u', { dur: 1400, cls: 'dim', r: 2.5 });
    c.log('SUM', { zh: '答案逐帧外发', en: 'answer streamed frame by frame' });
    await c.sleep(900);

    await chStore(c, { zh: '终态覆盖写 workbench_chat_context · 28.4k < 32k 不压缩', en: 'final state overwrites workbench_chat_context · 28.4k < 32k, no compression' });
    c.log('GATE', { zh: '闸门释放 · 等下一条消息', en: 'gates released · waiting for the next message' }, 'dim');

  } else if (scene === 1) {
    // 三幕：派发中 → 新消息插队（让位）→ 空闲后补答
    await chGates(c, { zh: '「BTC 现在资金费什么水平？」', en: '“Where is BTC funding right now?”' }, true);
    c.count('router', 1); c.chip('router', 'dm');
    c.log('ROUTE', { zh: 'tool_call → [market_agent] · 轮次 1/3', en: 'tool_call → [market_agent] · round 1/3' });
    await c.pulse('r-m'); c.on('xm'); c.row('xm', 'fund');
    c.log('EXPERT', { zh: 'market_agent 上游还没回 · 编排阻塞在等 IO——唯一可让位的窗口', en: 'market_agent still waiting upstream · the loop blocks on IO — the only yieldable window' });
    await c.sleep(1600);

    // 幕 2：新消息到达，当前轮立刻让位
    c.on('user'); c.status('yield');
    c.log('USER', { zh: '新消息插队：「先说下 ETH 价格！」', en: 'new message cuts in: “ETH price first!”' }, 'warn');
    await c.sleep(700);
    c.hold('xm'); c.hold('yq'); c.row('yq', 'q2', 'hit', true);
    c.done('router');
    await c.pulse('xm-yq', { dur: 900 });
    c.log('TURN', { zh: '让位：本轮结束 · working 存档 · 在途的 market_agent 批次进队列', en: 'yield: turn ends · working archived · the in-flight market_agent batch is queued' }, 'warn');
    await c.sleep(1000);

    // 新消息先被服务——这就是让位的意义
    c.status('run');
    c.log('TURN', { zh: '新消息开新一轮，插队先答', en: 'the new message runs first as its own turn' }, 'good');
    await c.pulse('u-g');
    c.on('gates'); await c.sleep(300); c.done('gates'); c.done('user');
    await c.pulse('g-r'); c.on('router'); c.count('router', 1);
    c.log('ROUTE', { zh: '轻问题 → FINISH 直接作答，不派专家', en: 'light question → FINISH, no experts needed' });
    await c.pulse('r-s', { dur: 900 });
    c.done('router'); c.on('sum');
    await c.type('sum', 0, { zh: 'ETH 现价 3097，1h −1.2%。', en: 'ETH at 3097, −1.2% on the hour.' });
    c.pulse('s-u', { dur: 1100, cls: 'dim', r: 2.5 });
    await c.sleep(500);
    await chStore(c, { zh: '插队轮落库 · 会话转入空闲', en: 'the cut-in turn stored · session goes idle' });

    // 幕 3：空闲 → 补答轮把批次取回来，第一个问题这才答完
    c.clearStream('sum');
    c.log('TURN', { zh: '会话空闲 → 前端发起补答轮：先接回让位那批在途专家', en: 'idle → the frontend starts a follow-up turn: reclaim the parked batch first' }, 'good');
    await c.pulse('xm-yq', { dur: 900, reverse: true });
    c.unhold('yq'); c.done('yq');
    c.unhold('xm'); c.on('xm');
    await c.sleep(400);
    await c.pulse('m-r', { cls: 'dim', dur: 750 }); c.done('xm');
    c.on('router'); c.count('router', 1);
    c.log('EXPERT', { zh: 'market_agent 结论并入 working · 之后与普通轮完全一样', en: 'market_agent conclusion merged · from here it is a normal turn' });
    await c.sleep(500);
    c.log('ROUTE', { zh: '→ FINISH · 转汇总，补答第一个问题', en: '→ FINISH · summarize the first question at last' });
    await c.pulse('r-s', { dur: 900 });
    c.done('router'); c.on('sum');
    await c.type('sum', 0, { zh: 'BTC 资金费 +0.008%，中性偏多；', en: 'BTC funding +0.008%, mildly long;' });
    c.pulse('s-u', { dur: 1200, cls: 'dim', r: 2.5 });
    await c.type('sum', 1, { zh: '8h 内无极端值，不构成信号。', en: 'no extremes in 8h — not a signal.' });
    c.pulse('s-u', { dur: 1200, cls: 'dim', r: 2.5 });
    await c.sleep(600);
    await chStore(c, { zh: '补答轮与普通轮同款收尾：终态覆盖写', en: 'a follow-up turn ends like any other: final state overwritten' });

  } else {
    await chGates(c, { zh: '「今晚有什么可能砸盘的消息？」', en: '“Any news tonight that could dump the market?”' });
    c.count('router', 1); c.chip('router', 'dn');
    c.log('ROUTE', { zh: 'tool_call → [news_agent] · 轮次 1/3', en: 'tool_call → [news_agent] · round 1/3' });
    await c.pulse('r-n'); c.on('xn'); c.row('xn', 'pre');
    c.log('EXPERT', { zh: 'news_agent：BlockBeats 预取 12 条 · 无参工具不挂、直接喂', en: 'news_agent: 12 BlockBeats items prefetched, fed straight in' });
    await c.sleep(900);
    await c.pulse('n-r', { cls: 'dim', dur: 600 }); c.done('xn');
    await c.sleep(400);
    c.count('router', 2);
    c.log('ROUTE', { zh: '→ FINISH · 转汇总', en: '→ FINISH · to summarizer' });
    await c.pulse('r-s', { dur: 1000 });
    c.done('router'); c.on('sum');
    c.row('sum', 'ws', 'hit', true);
    c.log('SUM', { zh: '端点是 responses 协议且勾了 web_search → 本轮捎上搜索许可', en: 'endpoint is responses + web_search → this call carries the search grant' });
    await c.sleep(700);
    c.log('SUM', { zh: '服务端搜索关不掉 · 与其硬压不如分工：清单 + 联网补充', en: 'server-side search can’t be switched off — so split the work: list + web supplement' });
    await c.type('sum', 0, { zh: '[BlockBeats] 美 CPI 今晚 21:30 公布；', en: '[BlockBeats] US CPI 21:30 tonight;' });
    c.pulse('s-u', { dur: 1200, cls: 'dim', r: 2.5 });
    await c.type('sum', 1, { zh: '[X] 某 L1 主网升级窗口撞同一时段；', en: '[X] L1 mainnet upgrade, same window;' });
    c.pulse('s-u', { dur: 1200, cls: 'dim', r: 2.5 });
    await c.type('sum', 2, { zh: '[BlockBeats+X] ETF 连续两日净流出。', en: '[BlockBeats+X] ETF outflows continue.' });
    c.pulse('s-u', { dur: 1200, cls: 'dim', r: 2.5 });
    c.log('SUM', { zh: '两边都有的合并 · 独有条目带源标签', en: 'overlaps merged · unique items keep their source tag' });
    await c.sleep(700);
    await chStore(c, { zh: '终态覆盖写 workbench_chat_context', en: 'final state overwrites workbench_chat_context' });
  }
}

/* ============ 装配 ============ */
const SPEEDS = [1, 1.5, 2];
let runners = [];

function boot() {
  closePop();
  document.getElementById('panels').innerHTML = '';
  runners.forEach(r => r.stop());
  runners = [];
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-k]').forEach(e => { e.textContent = T(UI[e.dataset.k]); });
  document.getElementById('btn-lang').textContent = LANG === 'zh' ? 'EN' : '中文';

  for (const cfg of PANELS) {
    const view = renderPanel(cfg);
    const isTrader = cfg.id === 'trader';
    const runner = new Runner(view, isTrader ? traderScript : chatScript, isTrader ? TR_SCENES : CH_SCENES);
    runners.push(runner);

    // 场景选择条：点谁跑谁，AUTO 恢复轮播
    const resume = () => {
      runner.paused = false; runner.userPaused = false;
      view.bPlay.innerHTML = '<svg data-icon="pause"></svg>'; icons(view.bPlay);
    };
    const bar = el('div', 'scene-bar');
    const autoBtn = el('button', 'scene-btn act');
    autoBtn.textContent = T(UI.auto);
    bar.appendChild(autoBtn);
    const sceneBtns = runner.scenes.map(s => {
      const b = el('button', 'scene-btn');
      b.textContent = T(s);
      bar.appendChild(b);
      return b;
    });
    view.panel.insertBefore(bar, view.panel.children[1]);
    runner.onScene = live => {
      autoBtn.classList.toggle('act', runner.pinned == null);
      sceneBtns.forEach((b, i) => {
        b.classList.toggle('act', runner.pinned === i);
        b.classList.toggle('live', live === i);
      });
    };
    autoBtn.addEventListener('click', () => { runner.pinned = null; resume(); runner.run(); });
    sceneBtns.forEach((b, i) => b.addEventListener('click', () => { runner.pinned = i; resume(); runner.run(); }));

    if (REDUCED) {
      Object.values(view.nodes).forEach(n => n.classList.add('on'));
      Object.values(view.paths).forEach(p => p.classList.add('on'));
      view.panel.querySelectorAll('.nrow').forEach(r => r.classList.add('ok'));
      runner.log('NOTE', UI.reduced);
      view.bPlay.disabled = view.bRe.disabled = view.bSpd.disabled = true;
      bar.querySelectorAll('button').forEach(b => b.disabled = true);
      continue;
    }
    view.bPlay.addEventListener('click', () => {
      runner.paused = !runner.paused;
      runner.userPaused = runner.paused;
      view.bPlay.innerHTML = runner.paused ? '<svg data-icon="play"></svg>' : '<svg data-icon="pause"></svg>';
      view.bPlay.title = runner.paused ? T(UI.play) : T(UI.pause);
      if (runner.paused) runner.status('paused');
      icons(view.bPlay);
    });
    view.bRe.addEventListener('click', () => { runner.paused = false; runner.userPaused = false; view.bPlay.innerHTML = '<svg data-icon="pause"></svg>'; icons(view.bPlay); runner.run(); });
    view.bSpd.addEventListener('click', () => {
      const i = (SPEEDS.indexOf(runner.speed) + 1) % SPEEDS.length;
      runner.speed = SPEEDS[i];
      view.bSpd.textContent = runner.speed.toFixed(1) + '×';
    });
    // 滚出视口自动挂起，省 CPU；用户手动暂停的不抢救
    new IntersectionObserver(es => {
      for (const e of es) {
        if (runner.userPaused) continue;
        runner.paused = !e.isIntersecting;
      }
    }, { threshold: .12 }).observe(view.panel);
    runner.run();
  }
  icons();
}

/* 主题 */
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  const b = document.getElementById('btn-theme');
  b.innerHTML = dark ? '<svg data-icon="sun"></svg>' : '<svg data-icon="moon"></svg>';
  icons(b);
}
const savedTheme = store.get('wiib-flow-theme');
let isDark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
document.getElementById('btn-theme').addEventListener('click', () => {
  isDark = !isDark; store.set('wiib-flow-theme', isDark ? 'dark' : 'light'); applyTheme(isDark);
});
document.getElementById('btn-lang').addEventListener('click', () => {
  LANG = LANG === 'zh' ? 'en' : 'zh'; store.set('wiib-flow-lang', LANG); boot();
});

applyTheme(isDark);
boot();
